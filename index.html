function crisisLevel(){
  let c = 0;
  if(S.flags.starved) c++;
  if(S.morale < 30) c++;
  if(S.flags.neglected) c++;
  if(S.nations.filter(n => n.war && !n.conquered).length >= 2) c++;
  return c;
}
const eventSystem = {
  BASE_CHANCE: 0.03,
  roll(){
    // 선택형 사건: 별도로 낮은 확률
    if(!S.pending && rnd() < 0.05 && S.turn > 4){
      const pool = CHOICE_EVENTS.filter(e => !e.cond || e.cond());
      if(pool.length){
        let sum = pool.reduce((a,e)=>a+e.w,0), r = rnd()*sum, chosen = pool[0];
        for(const e of pool){ r -= e.w; if(r<=0){ chosen = e; break; } }
        S.pending = chosen.make();
        S.counters.events++;
        return;
      }
    }
    const crisis = crisisLevel();
    // 기본 3%. 위기가 겹칠수록 세상이 더 자주, 더 사납게 군다
    if(rnd() >= eventSystem.BASE_CHANCE * (1 + crisis * 0.9)) return;
    let pool = EVENTS.filter(e => (!e.cond || e.cond()) && e.id !== S.flags.lastEvent);
    if(crisis >= 2){ const bad = pool.filter(e => !e.good); if(bad.length) pool = bad; }
    if(!pool.length) return;
    let sum = pool.reduce((a,e)=>a+e.w,0), r = rnd()*sum, chosen = pool[0];
    for(const e of pool){ r -= e.w; if(r<=0){ chosen = e; break; } }
    const out = chosen.run();
    S.flags.lastEvent = chosen.id;
    S.counters.events++;
    S.flags.eventNote = `${out.t} — ${out.d}`;
    log(`[사건] ${out.t}: ${out.d}`, chosen.good ? "good" : "bad");
  }
};

/* ---------------------- 최종 테크 ---------------------- */
function checkFinals(){
  for(const f of FINALS){
    if(S.finals.indexOf(f.id) >= 0) continue;
    const r = f.req;
    if(r.tech && !r.tech.every(t=>has(t))) continue;
    if(r.tier && civTier() < r.tier) continue;
    if(r.stat){ let ok = true; for(const k in r.stat) if(S.stats[k] < r.stat[k]) ok = false; if(!ok) continue; }
    if(r.pop && S.pop < r.pop) continue;
    if(r.trades && S.counters.trades < r.trades) continue;
    if(r.conquer && S.counters.conquer < r.conquer) continue;
    if(r.metal){ let ok = true; for(const k in r.metal) if((S.metals[k]||0) < r.metal[k]) ok = false; if(!ok) continue; }
    S.finals.push(f.id);
    log(`최종 테크 도달 가능 — ${f.n}. ${f.d}`, "mag");
  }
}
function finalMissing(f){
  const out = [];
  const r = f.req;
  if(r.tech) for(const t of r.tech) if(!has(t)) out.push(`${(TECH_BY_ID[t]||{n:t}).n} 연구`);
  if(r.tier && civTier() < r.tier) out.push(`${TIERS[r.tier]} 등급`);
  if(r.stat) for(const k in r.stat) if(S.stats[k] < r.stat[k])
    out.push(`${STAT_META.find(s=>s[0]===k)[1]} ${r.stat[k]} (현재 ${Math.round(S.stats[k])})`);
  if(r.pop && S.pop < r.pop) out.push(`인구 ${r.pop}`);
  if(r.trades && S.counters.trades < r.trades) out.push(`교역 성공 ${r.trades}회 (현재 ${S.counters.trades})`);
  if(r.conquer && S.counters.conquer < r.conquer) out.push(`국가 복속 ${r.conquer}회`);
  if(r.metal) for(const k in r.metal) if((S.metals[k]||0) < r.metal[k]) out.push(`${METAL_BY_ID[k].name} ${r.metal[k]}`);
  return out;
}
function achieveFinal(f){
  S.finalDone = f.id;
  log(`━━ ${f.n} 달성. ${f.d} ━━`, "mag");
  if(f.id === "immortal") unlockSpeciesGlobal("lich");
  const missing = FINALS.length - S.finals.length;
  uiSystem.modal(`<h2>${S.nationName} — ${f.n}</h2><p>${f.d}</p>
    <p class="small muted">${S.turn}턴, ${TIERS[civTier()]} 등급, 인구 ${Math.round(S.pop)}명으로 도달했다.</p>
    <p class="small">엔드게임이 열렸다. 문명은 계속 굴러간다 — 남은 최종 테크 ${missing}개와 히든 조건을 계속 노려볼 수 있다.</p>`);
}

/* 심연의 군세 — 후반에만 찾아오는, 외교가 통하지 않는 위협.
   물결이 거듭될수록 강해지고, 격퇴하면 그만한 것을 남긴다. */
function abyssWave(){
  if(S.pending || S.gameOver) return;
  if(civTier() < 7 && !S.finalDone) return;
  if(S.turn - (S.flags.lastAbyss !== undefined ? S.flags.lastAbyss : -80) < 26) return;
  if(rnd() > 0.22) return;
  S.flags.lastAbyss = S.turn;
  const wave = (S.flags.abyssWave || 0) + 1;
  S.flags.abyssWave = wave;
  const power = battleSystem.playerPower() * (0.80 + wave*0.14);
  const names = ["잿빛 행렬","이름 없는 군세","별 아래의 것들","심연에서 올라온 무리","마지막 손님"];
  const nm = names[Math.min(wave-1, names.length-1)];
  const reward = () => {
    const pool = technologySystem.availableMetals();
    const g = Math.round(40 + wave*25);
    if(pool.length) resourceSystem.gainMetal(pool[pool.length-1].id, g);
    S.counters.ruins++; technologySystem.refreshVisible();
    return `그들이 남긴 것에서 금속 ${g}과 낯선 문자를 건졌다.`;
  };
  S.pending = {
    title: `${nm} — 제${wave}파`,
    text: `국경이 아니라 하늘이 먼저 어두워졌다. 어느 나라의 깃발도 달지 않은 무리가 밀려온다. `
        + `사절도 조공도 통하지 않는다. 셈한 전력은 약 ${Math.round(power)}, 우리 전력은 약 ${Math.round(battleSystem.playerPower())}이다.`,
    options: [
      {label:"전군을 세워 정면으로 막는다",
       chanceFn:()=>clamp(battleSystem.playerPower()/(battleSystem.playerPower()+power) + b("wall")*0.02 + mt("war"), 0.05, 0.92),
       hint:"성공 시 격퇴와 전리품 / 실패 시 인구와 군사력에 큰 타격",
       run(ok){
         if(ok){ S.morale = clamp(S.morale+18,0,100); S.stats.mil += 4;
           return `${nm}을(를) 성벽 앞에서 끊어냈다. 사기 +18, 군사력 +4. ` + reward(); }
         const loss = Math.max(8, S.pop*0.18); S.pop -= loss;
         S.stats.mil = Math.max(4, S.stats.mil-8); S.morale = clamp(S.morale-20,0,100);
         const keys = Object.keys(S.buildings).filter(k=>S.buildings[k]>0);
         if(keys.length){ const k=pick(keys); S.buildings[k]--; }
         return `대열이 뚫렸다. 인구 -${Math.round(loss)}, 군사력 -8, 건물 하나 소실.`;
       }},
      {label:"성벽과 결계 뒤에서 버틴다",
       chanceFn:()=>clamp(battleSystem.playerPower()*(1+b("wall")*0.12)/(battleSystem.playerPower()*(1+b("wall")*0.12)+power*1.05)
                          + (M().ward>0?0.15:0) + (S.mods.defend||0), 0.05, 0.9),
       hint:"성벽·결계가 있을수록 유리하다. 전리품은 적다",
       run(ok){
         if(M().ward > 0) M().ward--;
         if(ok){ S.morale = clamp(S.morale+10,0,100); S.res.stone = Math.max(0,S.res.stone-40);
           return `문은 끝내 열리지 않았다. 석재 -40, 사기 +10.`; }
         const loss = Math.max(5, S.pop*0.10); S.pop -= loss;
         S.res.wood = Math.max(0,S.res.wood*0.6); S.res.stone = Math.max(0,S.res.stone*0.6);
         return `외벽이 무너졌다. 인구 -${Math.round(loss)}, 창고의 40% 소실.`;
       }},
      {label:"도시를 비우고 물러난다", chanceFn:()=>1,
       hint:"인명은 지키지만 기반을 크게 잃는다",
       run(){
         const keys = Object.keys(S.buildings).filter(k=>S.buildings[k]>0);
         let lost = 0;
         for(let i=0;i<2 && keys.length;i++){ const k=pick(keys); if(S.buildings[k]>0){ S.buildings[k]--; lost++; } }
         S.res.wood *= 0.5; S.res.stone *= 0.5;
         S.pop -= Math.max(2, S.pop*0.03); S.morale = clamp(S.morale-14,0,100);
         return `사람은 지켰고 도시는 내줬다. 건물 ${lost}채와 비축 절반이 사라졌다. 사기 -14.`;
       }},
      ...(canMagic() && has("mag4") ? [{
        label:"공허로 되돌려 보낸다",
        chanceFn:()=>clamp(0.12 + effStat("mag")/200, 0.05, 0.85),
        hint:"성공 시 피해 없이 소멸시키고 마법력 상승 / 실패 시 심각한 반동",
        run(ok){
          if(ok){ S.stats.mag += 8; S.morale = clamp(S.morale+16,0,100);
            return `문장이 닫히며 그들이 왔던 곳으로 되돌아갔다. 마법력 +8, 사기 +16. ` + reward(); }
          const loss = Math.max(6, S.pop*0.14); S.pop -= loss;
          S.stats.mag = Math.max(4, S.stats.mag-8); S.morale = clamp(S.morale-18,0,100);
          return `균열이 우리 쪽에서 벌어졌다. 인구 -${Math.round(loss)}, 마법력 -8.`;
        }}] : [])
    ]
  };
  log(`${nm}이(가) 지평선을 덮었다. 제${wave}파.`, "bad");
}

/* 세계 정복 판정 — 모든 나라를 복속시키면 알린다 */
function checkDomination(){
  const live = S.nations.filter(n => !n.absorbed);
  const total = live.length;
  const conquered = live.filter(n => n.conquered).length;
  const held = live.filter(n => n.conquered || n.vassal).length;

  if(!S.flags.hegemon && held === total && total > 0){
    S.flags.hegemon = true;
    log(`${total}개국 전부가 우리 깃발 아래 들어왔다. 복속 ${conquered}개국, 속국 ${total-conquered}개국.`, "mag");
  }
  if(!S.flags.dominated && conquered === total && total > 0){
    S.flags.dominated = true;
    log(`━━ 세계 정복. ${total}개국 전부를 복속시켰다. 지도 위에 다른 깃발이 남지 않았다. ━━`, "mag");
    uiSystem.modal(`<h2>세계 정복 — ${S.nationName}</h2>
      <p>이 세계에 존재했던 ${total}개국 전부가 ${S.nationName}에 복속됐다.
      ${S.day}일차, ${TIERS[civTier()]} 등급, 인구 ${Math.round(S.pop)}명.</p>
      <p class="small muted">전쟁 ${S.counters.wars}회 · 복속 ${S.counters.conquer}개국 · 배신 ${S.counters.betrays}회 ·
      교역 ${S.counters.trades}회로 여기까지 왔다.</p>
      <p class="small">문명은 계속 굴러간다. 남은 최종 테크와 아다만티움 등급을 노려볼 수 있다.</p>`);
  }
}

/* 히든 종족 해금(브라우저 전역 저장) */
function unlockSpeciesGlobal(id){
  try{
    const key = LS.unlocks(profileSystem.ensure());
    const arr = JSON.parse(localStorage.getItem(key) || "[]");
    if(arr.indexOf(id) < 0){
      arr.push(id);
      localStorage.setItem(key, JSON.stringify(arr));
      log(`히든 종족 해금 — ${SPECIES_BY_ID[id].name}. 다음 게임부터 선택할 수 있다.`, "mag");
    }
  }catch(e){}
}
function unlockedSpecies(){
  try{ return JSON.parse(localStorage.getItem(LS.unlocks(profileSystem.ensure())) || "[]"); }catch(e){ return []; }
}

/* ---------------------- turnSystem ---------------------- */
const turnSystem = {
  endTurn(){
    if(S.gameOver) return;
    S.turn++;
    if(S.phase === "낮"){ S.phase = "밤"; }
    else { S.phase = "낮"; S.day++; }
    const mg = M();
    if(S.flags.fallow){
      S.flags.fallow.t--;
      if(S.flags.fallow.t <= 0){
        S.res.food += S.flags.fallow.amt;
        log(`묵혔던 땅에서 한꺼번에 거둬들였다. 식량 +${S.flags.fallow.amt}.`, "good");
        S.flags.fallow = null;
      }
    }
    if(mg.fire > 0) mg.fire--;
    if(mg.scoutBoost > 0) mg.scoutBoost--;
    if(mg.overdrive > 0) mg.overdrive--;
    if(S.flags.fallout > 0){
      S.flags.fallout--;
      S.pop -= Math.max(1, S.pop*0.012);
      S.morale = clamp(S.morale - 1.5, 0, 100);
      if(S.flags.fallout === 0) log("낙진이 걷혔다. 땅은 아직 예전 같지 않다.", "warn");
    }
    for(const n of S.nations) if(n.defBroken > 0) n.defBroken--;
    resourceSystem.tick();
    eventSystem.roll();
    nationSystem.worldTurn();
    abyssWave();
    // 사건·전투로 인구가 음수로 내려가는 일이 없도록 마지막에 한 번 정리한다
    S.pop = Math.max(0, S.pop);
    if(S.pop < 1 && !S.gameOver){
      S.gameOver = true;
      log("마지막 한 사람이 눈을 감았다. 문명의 서는 여기서 끊긴다.", "bad");
    }
    technologySystem.refreshVisible();
    checkFinals();
    checkDomination();
    if(civTier() >= 9) unlockSpeciesGlobal("automata");
  }
};

/* ---------------------- magicSystem ---------------------- */
/* 마법은 수치 보정이 아니라 실제 행동으로 쓰인다.
   지속 효과는 S.magic에 남고, 대상이 있는 주문은 상대 국가 상태를 직접 바꾼다. */

   outcome:"성공 시 금속 대량 확보 / 실패 시 갱도 붕괴로 인구 손실"},

  {id:"m_rift", req:"mag4", name:"차원 균열을 연다",
   desc:"세계의 이음매를 억지로 벌린다. 무엇이 나올지는 아무도 모른다.",
   outcome:"대박 아니면 재앙. 중간이 거의 없다"},
  {id:"m_dragon", req:"h_dragon", name:"용의 이름을 부른다",
   desc:"비늘 달린 것들의 진명을 부른다.",
   outcome:"성공 시 군사력 대폭 상승과 사기 급등 / 실패 시 재앙"}
];

const magicSystem = {
  available(){
    if(!canMagic()) return [];
    return MAGIC_ACTIONS.filter(a => has(a.req));
  },
  run(id){
    const c = probabilitySystem.calculateSuccessChance(id, S);
    const res = probabilitySystem.roll(c);
    const mg = M();
    const big = res.tier === "대성공", ok = big || res.tier === "성공";
    const part = res.tier === "부분 성공", odd = res.tier === "돌발";
    let msg = "";
    switch(id){
      case "m_rain": {
        if(ok || part){
          const mul = big ? 1.9 : (part ? 0.45 : 1);
          const f = Math.round(28 * (1 + effStat("agri")/80) * mul);
          const w = Math.round(16 * mul);
          if(sp().food > 0) S.res.food += f;
          S.res.wood += w;
          msg = `비가 내렸다. ${sp().food>0?`식량 +${f}, `:""}목재 +${w}.`;
        }else if(odd){ S.res.wood += 40; S.stats.mag += 3; msg = "정령이 엉뚱한 답을 했다. 목재 +40, 마법력 +3."; }
        else { S.morale = clamp(S.morale-5,0,100); msg = "부름에 아무도 답하지 않았다. 사기 -5."; }
        break;
      }
      case "m_read": {
        if(ok){ mg.scoutBoost = big ? 6 : 4; if(big) S.stats.scout += 2;
          msg = `땅이 길을 알려줬다. ${mg.scoutBoost}턴간 정찰 성공률 +25%p.${big?" 정찰력 +2.":""}`; }
        else if(part){ mg.scoutBoost = 2; msg = "흐릿하지만 방향은 잡았다. 2턴간 정찰 +25%p."; }
        else if(odd){ S.counters.ruins++; technologySystem.refreshVisible(); msg = "땅의 기억 속에서 묻힌 유적의 위치를 보았다."; }
        else { S.morale = clamp(S.morale-3,0,100); msg = "땅은 아무것도 말하지 않았다."; }
        break;
      }
      case "m_rune": {
        if(!resourceSystem.spendMetal(12)){ return {msg:"룬을 새길 금속이 없다.", chance:c, res:{tier:"실패"}}; }
        if(big){ S.stats.mil += 6; S.stats.prod += 2; msg = "룬이 완벽하게 맞물렸다. 군사력 +6, 생산력 +2."; }
        else if(ok){ S.stats.mil += 3; msg = "무구에 룬이 새겨졌다. 군사력 +3."; }
        else if(part){ S.stats.mil += 1; msg = "절반만 성공했다. 군사력 +1."; }
        else if(odd){ S.stats.mil += 4; S.stats.mag += 4; msg = "룬이 스스로 문장을 바꿨다. 군사력 +4, 마법력 +4."; }
        else { msg = "룬이 깨지며 금속만 날렸다."; }
        break;
      }
      case "m_ward": {
        if(ok){ mg.ward = big ? 5 : 3; msg = `결계가 섰다. 다음 ${mg.ward}번의 방어 판정에 +15%p.`; }
        else if(part){ mg.ward = 1; msg = "결계가 얇게 걸렸다. 다음 1번의 방어 판정에 +15%p."; }
        else if(odd){ mg.ward = 4; S.morale = clamp(S.morale+8,0,100); msg = "결계가 빛을 내자 백성이 안심했다. 4회분 결계, 사기 +8."; }
        else { S.morale = clamp(S.morale-4,0,100); msg = "결계가 서지 않았다. 사기 -4."; }
        break;
      }
      case "m_vein": {
        const pool = technologySystem.availableMetals();
        if(!pool.length){ S.res.stone += 30; msg = "갈라낸 암반에서 쓸 금속을 찾지 못했다. 석재 +30."; break; }
        if(ok || part){
          const m = big ? pool[pool.length-1] : pool[Math.floor(rnd()*pool.length)];
          const g = Math.round(15 * (1 + effStat("mine")/95) * (big?2:(part?0.4:1)) / (1 + m.rare*0.15));
          resourceSystem.gainMetal(m.id, g);
          msg = `암반이 갈라졌다. ${m.name} +${g}.`;
        }else if(odd){ S.counters.ruins++; technologySystem.refreshVisible(); S.res.stone += 25;
          msg = "갈라진 틈 안쪽에서 인공 구조물이 드러났다."; }
        else { const loss = Math.max(2, Math.round(S.pop*0.02)); S.pop -= loss;
          msg = `주문이 어긋나 갱도가 무너졌다. 인구 -${loss}.`; }
        break;
      }
      case "m_fire": {
        if(ok){ mg.fire = big ? 3 : 2; msg = `불의 인장이 깔렸다. 다음 ${mg.fire}회 전투 승률 +12%p.`; }
        else if(part){ mg.fire = 1; msg = "인장이 하나만 남았다. 다음 1회 전투 +12%p."; }
        else if(odd){ mg.fire = 2; S.stats.mag += 4; msg = "불이 스스로 형태를 잡았다. 전투 인장 2회, 마법력 +4."; }
        else { S.morale = clamp(S.morale-6,0,100); S.res.wood = Math.max(0,S.res.wood-15);
          msg = "불이 아군 진영으로 번졌다. 목재 -15, 사기 -6."; }
        break;
      }
      case "m_foresee": {
        if(ok){ mg.foresight += big ? 2 : 1; msg = `예지를 붙잡았다. 다음 실패 판정 ${mg.foresight}회를 다시 굴린다.`; }
        else if(part){ msg = "형상은 보였으나 문장이 되지 않았다."; }
        else if(odd){ mg.foresight += 1; S.counters.ruins++; technologySystem.refreshVisible();
          msg = "미래 대신 과거가 보였다. 예지 1회와 유적의 단서를 얻었다."; }
        else { S.morale = clamp(S.morale-4,0,100); msg = "본 것을 견디지 못한 술사들이 앓아누웠다. 사기 -4."; }
        break;
      }
      case "m_rift": {
        const roll2 = rnd();
        if(big || (ok && roll2 > 0.4)){
          const pool = technologySystem.availableMetals();
          const g = Math.round(45 + rnd()*60);
          if(pool.length) resourceSystem.gainMetal(pool[pool.length-1].id, g);
          S.stats.mag += 6; S.counters.ruins++; technologySystem.refreshVisible();
          msg = `균열 너머에서 금속 ${g}과 낯선 문자가 쏟아졌다. 마법력 +6.`;
        }else if(ok){ S.stats.mag += 5; S.stats.sci += 3; msg = "균열은 조용히 닫혔지만 그 안을 보았다. 마법력 +5, 과학력 +3."; }
        else if(part){ msg = "균열은 열렸다 곧 닫혔다. 남은 것은 냄새뿐이다."; }
        else if(odd){ S.pop += Math.round(S.pop*0.06)+5; msg = "균열에서 낯선 이들이 걸어 나와 정착을 청했다. 인구 증가."; }
        else { const loss = Math.max(4, Math.round(S.pop*0.06)); S.pop -= loss; S.morale = clamp(S.morale-14,0,100);
          msg = `균열에서 무언가 나왔다. 인구 -${loss}, 사기 -14.`; }
        break;
      }
      case "m_dragon": {
        if(ok){ S.stats.mil += big?20:12; S.morale = clamp(S.morale+(big?22:14),0,100);
          if(big) resourceSystem.gainMetal("gold", 25);
          msg = `진명에 응답이 왔다. 군사력 +${big?20:12}, 사기 급등.${big?" 금 +25.":""}`; }
        else if(part){ S.stats.mag += 5; msg = "이름이 반쯤 닿았다. 마법력 +5."; }
        else if(odd){ S.stats.mil += 8; S.pop -= Math.max(2, S.pop*0.02);
          msg = "응답한 것은 용이 아니었다. 그래도 싸울 줄은 안다. 군사력 +8."; }
        else { const loss = Math.max(3, Math.round(S.pop*0.05)); S.pop -= loss; S.morale = clamp(S.morale-15,0,100);
          msg = `부름이 모욕으로 받아들여졌다. 인구 -${loss}, 사기 -15.`; }
        break;
      }
    }
    log("마법: " + msg, res.tier==="실패" ? "bad" : "mag");
    return {msg, chance:c, res};
  },

  /* 대상이 있는 공격 주문 */
  siege(n){
    const c = probabilitySystem.calculateSuccessChance("m_siege", S, n);
    const res = probabilitySystem.roll(c);
    if(res.tier==="대성공"){ n.defBroken = 5; n.mil = Math.round(n.mil*0.9); n.attitude = clamp(n.attitude-18,-100,100);
      log(`${n.name}의 성벽이 마법에 무너졌다.`, "mag");
      return {msg:`${n.name}의 성벽이 통째로 주저앉았다. 5턴간 공격 승률 +12%p, 적 군사력 -10%.`, chance:c, res}; }
    if(res.tier==="성공"){ n.defBroken = 3; n.attitude = clamp(n.attitude-15,-100,100);
      return {msg:`${n.name}의 성벽에 균열을 냈다. 3턴간 공격 승률 +12%p.`, chance:c, res}; }
    if(res.tier==="부분 성공"){ n.defBroken = 1; n.attitude = clamp(n.attitude-8,-100,100);
      return {msg:"돌 몇 장을 떨궜다. 1턴간 공격 승률 +12%p.", chance:c, res}; }
    if(res.tier==="돌발"){ n.attitude = clamp(n.attitude-25,-100,100); n.war = true;
      return {msg:`주문이 성벽 대신 왕궁을 때렸다. ${n.name}이(가) 즉시 전쟁을 선포했다.`, chance:c, res}; }
    S.morale = clamp(S.morale-5,0,100); n.attitude = clamp(n.attitude-10,-100,100);
    return {msg:"주문이 튕겨 나왔다. 사기 -5, 관계 악화.", chance:c, res};
  },
  barrage(n){
    const c = probabilitySystem.calculateSuccessChance("m_barrage", S, n);
    const res = probabilitySystem.roll(c);
    const before = Math.round(n.mil);
    if(res.tier==="대성공"){ n.mil = Math.round(n.mil*0.7); n.stock.metal = Math.round(n.stock.metal*0.85);
      n.attitude = clamp(n.attitude-30,-100,100); n.war = true;
      log(`${n.name}의 군영이 원소 폭격에 불탔다.`, "mag");
      return {msg:`${n.name}의 군사력이 ${before} → ${Math.round(n.mil)}으로 떨어졌다. 전쟁 상태에 들어간다.`, chance:c, res}; }
    if(res.tier==="성공"){ n.mil = Math.round(n.mil*0.85); n.attitude = clamp(n.attitude-25,-100,100);
      if(rnd()<0.5) n.war = true;
      return {msg:`${n.name}의 군사력이 ${before} → ${Math.round(n.mil)}으로 줄었다.`, chance:c, res}; }
    if(res.tier==="부분 성공"){ n.mil = Math.round(n.mil*0.95); n.attitude = clamp(n.attitude-15,-100,100);
      return {msg:"변두리 진영만 태웠다. 상대는 우리를 기억할 것이다.", chance:c, res}; }
    if(res.tier==="돌발"){ n.attitude = clamp(n.attitude-40,-100,100); n.war = true; S.stats.mag += 4;
      return {msg:`폭격이 예상보다 크게 번졌다. 마법력 +4, ${n.name}은(는) 전면전을 선언했다.`, chance:c, res}; }
    S.morale = clamp(S.morale-8,0,100); S.pop -= Math.max(1, S.pop*0.015); n.attitude = clamp(n.attitude-12,-100,100);
    return {msg:"주문이 되돌아왔다. 인구와 사기를 잃었다.", chance:c, res};
  }
};

  {id:"expedscout", req:"scout1", tab:"탐험", name:"원정 정찰대를 보낸다", cost:{food:25, wood:20},
   desc:"돌아오지 못할 각오로 지도 밖으로 보낸다. 미지의 국가를 확실하게 찾아낸다.",

   ch:()=>0.34 + effStat("scout")/190 + S.mods.scout*0.5,
   on(t){ S.counters.scouts++;

   desc:"해독한 문자를 따라 옛 문명의 장치를 그대로 만들어 본다.",
   outcome:"성공 시 연구 없이 기술 하나 획득 / 실패 시 자재와 사기 손실",
   ch:()=>0.26 + effStat("sci")/240 + effStat("mag")/400,
   on(t){ const pool = TECHS.filter(x => !x.hidden && !has(x.id) && technologySystem.canSee(x) && x.t <= civTier());
     if(t==="대성공" || t==="성공"){
       if(!pool.length){ S.stats.sci += 6; return "재현할 만한 것이 남지 않았다. 과학력 +6."; }
       const ready = pool.filter(x => technologySystem.preOk(x));
       const g = (ready.length ? ready : pool).sort((a,b2)=>b2.t-a.t)[0];
       S.techs.push(g.id); technologySystem.applyTech(g); technologySystem.refreshVisible();
       log(`유적 재현으로 ${g.n}을(를) 얻었다.`, "mag");

     if(t==="돌발"){ const g=Math.round(base*1.3); S.pop=Math.min(cap,S.pop+g); S.stats.mil+=4; return `전투용 개체가 섞여 나왔다. 인구 +${g}, 군사력 +4.`; }

  {id:"refine", req:"smelt3", tab:"자원", name:"금속을 정련한다",
   desc:"하급 금속을 녹여 상급 금속으로 다시 뽑는다. 양은 줄지만 급이 오른다.",
   outcome:"성공 시 하급 금속 12 → 상급 금속 4~6 / 실패 시 소실",

   on(t){ const pool = technologySystem.availableMetals();
     if(pool.length < 2) return "정련할 상급 금속 지식이 없다.";

     if(t==="성공"){ resourceSystem.gainMetal(high.id, 4); return `${low.name} 12 → ${high.name} 4.`; }
     if(t==="부분 성공"){ resourceSystem.gainMetal(high.id, 2); return `불순물이 많았다. ${high.name} 2만 건졌다.`; }

/* 대상 국가가 필요한 기술 행동 */
const TECH_TARGET_ACTIONS = [
  {id:"nuke", req:"ind5", tab:"군사", name:"핵을 발사한다",
   desc:"농축 시설에서 탄두를 꺼낸다. 발사 한 번에 모든 자원이 500씩 사라진다. 한 번 쏘면 그 나라는 다시 일어서지 못하고, 세계는 우리를 다르게 본다.",
   outcome:"상대 전력 대부분 소멸(대성공 시 국가 소멸) / 전 세계 관계 붕괴와 자국 낙진 피해는 확정",
   cost(){   // 발사 한 번에 모든 자원이 500씩 들어간다
     const c = {wood:500, stone:500, metal:500};
     const s2 = sp();
     if(s2.food > 0) c.food = 500;
     if(s2.vital !== "food" && s2.vital !== "gold" && s2.vital !== "sun") c[s2.vital] = 500;
     return c;
   },
   ch:(n)=>clamp(0.82 + effStat("sci")/600 - n.tier*0.01, 0.4, 0.95),
   run(n){
     if(b("reactor") < 1) return {msg:"농축 시설이 없다. 탄두를 조립할 곳조차 없다.", chance:0, res:{tier:"실패"}};
     const cost = this.cost();
     if(!resourceSystem.canPayAny(cost)) return {msg:"발사에 필요한 물자가 턱없이 모자란다.", chance:0, res:{tier:"실패"}};
     resourceSystem.payAny(cost);
     const c = this.ch(n); const res = probabilitySystem.roll(c);
     S.counters.wars++;
     S.counters.nukes = (S.counters.nukes || 0) + 1;

     // 어떤 결과든 치르는 값
     const fallout = () => {
       S.flags.fallout = Math.max(S.flags.fallout || 0, 10);
       S.morale = clamp(S.morale - 22, 0, 100);
       S.pop -= Math.max(3, S.pop*0.04);
       for(const o of S.nations){
         if(o === n || o.absorbed) continue;
         o.attitude = clamp(o.attitude - 45, -100, 100);
         if(o.discovered && o.attitude < -60 && rnd() < 0.5) o.war = true;
       }
       S.flags.lastCoalition = S.turn - 40;   // 연합이 곧바로 결성될 수 있다
     };

     if(res.tier === "대성공"){
       n.absorbed = true; n.war = false; n.ally = false; n.vassal = false;
       fallout();
       log(`${n.name}이(가) 지도에서 지워졌다.`, "bad");
       return {msg:`섬광 뒤에 남은 것은 없었다. ${n.name}은(는) 국가로서 존재하지 않는다. `
                 + `전 세계 관계 -45, 낙진으로 10턴간 식량 생산 급감, 사기 -22.`, chance:c, res};
     }
     if(res.tier === "성공"){
       n.mil = Math.round(n.mil*0.12); n.territory = Math.max(1, Math.round(n.territory*0.3));
       n.stock.wood = Math.round(n.stock.wood*0.2); n.stock.stone = Math.round(n.stock.stone*0.2);
       n.stock.metal = Math.round(n.stock.metal*0.2);
       n.attitude = -100; n.war = true; n.vassal = false;

const techActionSystem = {
  list(tab){ return TECH_ACTIONS.filter(a => a.tab === tab && (a.req === null || has(a.req)) && (!a.only || a.only())); },
  targets(tab){ return TECH_TARGET_ACTIONS.filter(a => a.tab === tab && has(a.req)); },
  run(a){
    const c = clamp(a.ch(), 0.03, 0.95);
    if(a.cost && !resourceSystem.canPay(a.cost)) return {msg:"자원이 모자라 시작하지 못했다.", chance:c, res:{tier:"실패"}};
    if(a.cost) resourceSystem.pay(a.cost);
    const res = probabilitySystem.roll(c);
    const msg = a.on(res.tier) || "";
    log(`${a.name}: ${msg}`, res.tier === "실패" ? "bad" : "good");
    return {msg, chance:c, res};
  }
};

/* ---------------------- 행동 실행 ---------------------- */
function gatherAction(kind){
  const map = {
    wood:{res:"wood", name:"벌목", base:9, stat:"prod", terr:"wood"},
    stone:{res:"stone", name:"채석", base:8, stat:"prod", terr:"stone"},
    food:{res:"food", name:"수확", base:14, stat:"agri", terr:"food"}
  };
  const m = map[kind];
  const c = probabilitySystem.calculateSuccessChance(kind, S);
  const res = probabilitySystem.roll(c);
  const scale = m.base * (1 + effStat(m.stat)/80) * S.terrain[m.terr] * (0.6 + 0.4*popLabor()) * DF().res;
  let msg;
  if(res.tier === "대성공"){ const g = Math.round(scale*1.8); S.res[m.res] += g; msg = `${m.name} 대성공. +${Math.round(g)}`; }
  else if(res.tier === "성공"){ const g = Math.round(scale); S.res[m.res] += g; msg = `${m.name} 성공. +${g}`; }
  else if(res.tier === "부분 성공"){ const g = Math.round(scale*0.45); S.res[m.res] += g; msg = `${m.name} 부분 성공. +${g}`; }
  else if(res.tier === "돌발"){ const g = Math.round(scale*1.2); S.res[m.res] += g; S.stats[m.stat] += 2;
    msg = `작업 중 새 방법을 찾았다. +${g}, ${STAT_META.find(s=>s[0]===m.stat)[1]} +2`; }
  else { const g = Math.round(scale*0.15); S.res[m.res] += g; S.morale = clamp(S.morale-2,0,100);
    msg = `${m.name} 실패. +${g}, 사기 -2`; }
  log(msg, res.tier==="실패" ? "bad" : "good");
  return {msg, chance:c, res};
}
function mineAction(){
  const c = probabilitySystem.calculateSuccessChance("metal", S);
  const res = probabilitySystem.roll(c);
  const pool = technologySystem.availableMetals();
  if(!pool.length){
    S.res.stone += 12;
    return {msg:"제련 기술이 없어 광석을 쓸 수 없다. 석재만 +12.", chance:c, res};
  }
  let idx = Math.floor(Math.pow(rnd(), 2.0 - (S.species==="dwarf"?0.5:0) - (S.species==="dragonkin"?0.4:0)) * pool.length);
  idx = clamp(idx, 0, pool.length-1);
  if(res.tier === "대성공") idx = pool.length-1;
  const m = pool[idx];
  const scale = 6.5 * (1 + effStat("mine")/80) * S.terrain.metal * (0.6 + 0.4*popLabor()) * DF().res / (1 + m.rare*0.22);
  let msg;
  if(res.tier === "대성공"){ const g = Math.round(scale*1.9); resourceSystem.gainMetal(m.id,g); msg = `대성공 — 최상급 광맥을 뚫었다. ${m.name} +${g}`; }
  else if(res.tier === "성공"){ const g = Math.round(scale); resourceSystem.gainMetal(m.id,g); msg = `${m.name} +${g}`; }
  else if(res.tier === "부분 성공"){ const g = Math.round(scale*0.4); resourceSystem.gainMetal(m.id,g); S.res.stone += 8; msg = `${m.name} +${g}, 석재 +8`; }
  else if(res.tier === "돌발"){ const g = Math.round(scale*0.8); resourceSystem.gainMetal(m.id,g);
    S.counters.ruins++; technologySystem.refreshVisible(); msg = `갱도 끝에서 오래된 벽화를 발견했다. ${m.name} +${g}`; }
  else { const loss = Math.max(1, Math.round(S.pop*0.012*Math.max(0,1+S.mods.collapse+mt("disaster")))); S.pop -= loss;
    msg = `갱도가 일부 무너졌다. 인구 -${loss}`; }
  log("채굴: " + msg, res.tier==="실패" ? "bad" : "good");
  return {msg, chance:c, res};
}
function vitalAction(){
  const s = sp();
  const c = probabilitySystem.calculateSuccessChance(s.vital==="sun" ? "sun" : "vital", S);
  const res = probabilitySystem.roll(c);
  const V = VITALS[s.vital];
  let msg;
  if(s.vital === "sun"){
    const before = S.res.sun;
    let note = "";
    if(res.tier==="대성공"){ S.res.sun = 100; note = "온몸이 빛을 머금었다."; }
    else if(res.tier==="성공"){ S.res.sun = clamp(S.res.sun+45,0,100); note = "잎맥까지 볕이 닿았다."; }
    else if(res.tier==="부분 성공"){ S.res.sun = clamp(S.res.sun+18,0,100); note = "구름이 자주 지나갔다."; }
    else if(res.tier==="돌발"){ S.res.sun = 100; S.stats.mag += 3; note = "빛이 유난히 짙었다. 마법력 +3."; }
    else { S.res.sun = clamp(S.res.sun+5,0,100); note = "온종일 흐렸다."; }
    const gain = Math.round(S.res.sun - before);
    msg = `${note} 일광 ${Math.round(before)}% → ${Math.round(S.res.sun)}% (${gain>0?"+":""}${gain})`;
    if(before >= 95) msg += " — 이미 가득 차 있어 대부분 흘려보냈다.";
  }else if(s.vital === "gold"){
    const base = 8 * (1 + effStat("mine")/70);
    const g = Math.round(base * (res.tier==="대성공"?2:res.tier==="성공"?1:res.tier==="부분 성공"?0.4:0.1));
    resourceSystem.gainMetal("gold", g); msg = `보물 수집 ${res.tier}. 금 +${g}.`;
  }else{
    const base = 10 * (1 + effStat("prod")/70) * (1 + (S.mods[s.vital]||0));
    const g = Math.round(base * (res.tier==="대성공"?2:res.tier==="성공"?1:res.tier==="부분 성공"?0.45:0.1));
    if(s.vital === "power"){ resourceSystem.spendMetal(g*0.5); }
    S.res[s.vital] += g;
    msg = `${V.name} 확보 ${res.tier}. ${V.name} +${g}.`;
  }
  log(msg, res.tier==="실패" ? "warn" : "good");
  return {msg, chance:c, res};
}
function trainAction(){
  const c = probabilitySystem.calculateSuccessChance("train", S);
  const res = probabilitySystem.roll(c);
  let msg;
  if(res.tier==="대성공"){ S.stats.mil += 6; S.morale = clamp(S.morale+6,0,100); msg = "훈련 대성공. 군사력 +6, 사기 +6."; }
  else if(res.tier==="성공"){ S.stats.mil += 3; msg = "훈련 성공. 군사력 +3."; }
  else if(res.tier==="부분 성공"){ S.stats.mil += 1; msg = "훈련 부분 성공. 군사력 +1."; }
  else if(res.tier==="돌발"){ S.stats.mil += 4; S.stats.scout += 3; msg = "훈련 중 새 전술이 나왔다. 군사력 +4, 정찰력 +3."; }
  else { S.pop -= 1; S.morale = clamp(S.morale-4,0,100); msg = "훈련 사고. 인구 -1, 사기 -4."; }
  log("훈련: " + msg, res.tier==="실패"?"bad":"good");
  return {msg, chance:c, res};
}
function festivalAction(){
  const c = probabilitySystem.calculateSuccessChance("festival", S);
  const res = probabilitySystem.roll(c);
  const cost = Math.round(10 + S.pop*0.05);
  const s = sp();
  const resKey = s.food > 0 ? "food" : s.vital;
  S.res[resKey] = Math.max(0, (S.res[resKey]||0) - cost);
  let msg;
  if(res.tier==="대성공"){ S.morale = clamp(S.morale+26,0,100); S.stats.dip += 2; msg = "축제 대성공. 사기 +26, 외교력 +2."; }
  else if(res.tier==="성공"){ S.morale = clamp(S.morale+16,0,100); msg = "축제 성공. 사기 +16."; }
  else if(res.tier==="부분 성공"){ S.morale = clamp(S.morale+7,0,100); msg = "조용한 축제였다. 사기 +7."; }
  else if(res.tier==="돌발"){ S.morale = clamp(S.morale+12,0,100); S.pop += Math.round(S.pop*0.04);
    msg = "축제 소문을 듣고 사람들이 모여들었다. 사기 +12, 인구 증가."; }
  else { S.morale = clamp(S.morale-4,0,100); msg = "축제가 난장판이 됐다. 사기 -4."; }
  log("축제: " + msg, res.tier==="실패"?"warn":"good");
  return {msg, chance:c, res};
}
function buildAction(bd){
  const cost = resourceSystem.buildCost(bd);
  const c = probabilitySystem.calculateSuccessChance("build", S, bd);
  resourceSystem.pay(cost);
  const res = probabilitySystem.roll(c);
  let msg;
  if(res.tier==="대성공"){ S.buildings[bd.id] = b(bd.id)+1; S.morale = clamp(S.morale+4,0,100);
    if(rnd()<0.35){ S.buildings[bd.id]++; msg = `${bd.name} 건설 대성공 — 자재가 남아 하나를 더 지었다. (×2)`; }
    else msg = `${bd.name} 건설 대성공. 사기 +4.`; }
  else if(res.tier==="성공"){ S.buildings[bd.id] = b(bd.id)+1; msg = `${bd.name} 완공.`; }
  else if(res.tier==="부분 성공"){ S.buildings[bd.id] = b(bd.id)+1; S.pop -= 1; msg = `${bd.name}을(를) 세웠지만 공사 중 사고가 있었다. 인구 -1.`; }
  else if(res.tier==="돌발"){ S.buildings[bd.id] = b(bd.id)+1; S.stats.prod += 3; msg = `${bd.name} 완공. 공법을 개량해 생산력 +3.`; }
  else { S.res.wood += Math.round((cost.wood||0)*0.3); S.res.stone += Math.round((cost.stone||0)*0.3);
    msg = `${bd.name} 건설 실패. 자재 30%만 회수했다.`; }
  applyBuildingStats(bd, res.tier !== "실패");
  log("건설: " + msg, res.tier==="실패"?"bad":"good");
  return {msg, chance:c, res};
}
function applyBuildingStats(bd, built){
  if(!built) return;
  if(bd.id==="lab") S.stats.sci += 4;
  if(bd.id==="tower") S.stats.mag += 5;
  if(bd.id==="barrack") S.stats.mil += 5;
  if(bd.id==="market") S.stats.dip += 2;
  if(bd.id==="reactor") S.stats.prod += 6;
}

        outcome:"성공 시 즉시 복속과 창고 절반 / 부분 성공 시 속국화 / 실패 시 관계 파탄과 전쟁",
        disabled: sCd > 0, disabledWhy: `사절이 아직 돌아오지 않았다 (${sCd}턴 남음)`,
        danger:true, kind:"war", tok:{T:n.name}, run:()=>diplomacySystem.demandSurrender(n)});
      const tCd = 4 - (S.turn - (n.lastTribute !== undefined ? n.lastTribute : -99));
      out.push({name:`조공을 요구한다 — ${n.name}`, chance:probabilitySystem.calculateSuccessChance("tribute",S,n),
        desc:`${n.name}에게 무력을 앞세워 자원을 요구한다. 되풀이할수록 상대의 반발이 쌓인다.`,
        note: n.demands ? `누적 요구 ${n.demands}회 · 반발 -${Math.round(n.demands*6)}%p` : "",
        outcome:"성공 시 상대 비축의 28~45% 확보 / 실패 시 관계 악화와 전쟁 위험",
        disabled: tCd > 0, disabledWhy: `아직 사절을 다시 보낼 수 없다 (${tCd}턴 남음)`,
        kind:"war", tok:{T:n.name}, run:()=>diplomacySystem.demandTribute(n)});
      out.push({name:`전쟁을 선포한다 — ${n.name}`, chance:probabilitySystem.calculateSuccessChance("war",S,n),
        desc:`${n.name} (${TIERS[n.tier]}${n.intel>=1?`, 군사력 약 ${n.mil}`:", 군사력 미상"}). 우리 전력 ${Math.round(battleSystem.playerPower())}`
             + (nationSystem.allySupport(n) > 0 ? ` + 동맹 지원 ${Math.round(nationSystem.allySupport(n)*0.8)} (${nationSystem.allyList(n).map(a=>a.name).join(", ")})` : "") + ".",
        outcome:"승리 시 전리품과 영토 / 대승 시 복속 / 패배 시 인구·군사력 손실",
        danger:true, kind:"war", tok:{T:n.name}, run:()=>battleSystem.war(n)});
    }
  }
  if(UI.tab === "외교"){
    const targets = S.nations.filter(n=>n.discovered && !n.conquered && !n.absorbed);
    if(!targets.length) out.push({name:"— 아직 아는 나라가 없다", chance:1, desc:"정찰 탭에서 정찰대를 보내라.", disabled:true, run:()=>({msg:""})});
    for(const n of targets){
      if(n.war) out.push({name:`휴전 제안 — ${n.name}`, chance:probabilitySystem.calculateSuccessChance("truce",S,n),
        desc:"전쟁을 멈추자고 제안한다. 전력이 앞설수록, 외교력이 높을수록 잘 통한다.",
        outcome:"성공 시 전쟁 종결 / 실패 시 관계 소폭 하락", kind:"contact", tok:{T:n.name},
        run:()=>diplomacySystem.truce(n)});
      out.push({name:`교류 — ${n.name}`, chance:probabilitySystem.calculateSuccessChance("contact",S,n),
        desc:`사절을 보내 관계를 쌓는다. 현재 관계 ${n.attitude}.`, outcome:"성공 시 관계 상승 / 실패 시 관계 하락", kind:"contact", tok:{T:n.name}, run:()=>diplomacySystem.contact(n)});
      out.push({name:`교역 — ${n.name}`, chance:probabilitySystem.calculateSuccessChance("trade",S,n),
        desc:`${diplomacySystem.offerText(n)}.`,
        cost: costItems({[diplomacySystem.getOffer(n).giveKey]: diplomacySystem.getOffer(n).giveAmt}),

        outcome:"성공 시 교환 성립과 관계 개선 / 부분 성공 시 물량 절반 / 실패 시 결렬(우리 물건은 돌아온다)",
        disabled: diplomacySystem.resAmount(diplomacySystem.getOffer(n).giveKey) < diplomacySystem.getOffer(n).giveAmt,
        disabledWhy: `내줄 ${diplomacySystem.RES_NAME[diplomacySystem.getOffer(n).giveKey]}이(가) 부족하다`,
        kind:"trade", tok:{T:n.name}, run:()=>diplomacySystem.trade(n)});
      if(!n.ally) out.push({name:`동맹 제안 — ${n.name}`, chance:probabilitySystem.calculateSuccessChance("ally",S,n),
        desc:"공동 방어와 교역 우대를 제안한다. 관계가 낮으면 거의 불가능하다.", outcome:"성공 시 동맹 / 부분 성공 시 불가침 / 실패 시 관계 하락", kind:"ally", tok:{T:n.name}, run:()=>diplomacySystem.ally(n)});
      if(n.ally || n.treaty) out.push({name:`배신 — ${n.name}`, chance:probabilitySystem.calculateSuccessChance("betray",S,n),
        desc:"신뢰를 자산으로 바꾼다. 다른 국가들도 이 소식을 듣는다.", outcome:"성공 시 대량 약탈 / 어느 쪽이든 전 세계 관계 악화",
        danger:true, kind:"betray", tok:{T:n.name}, run:()=>diplomacySystem.betray(n)});
      for(const ta of techActionSystem.targets("외교")){
        const cst = (typeof ta.cost === "function") ? ta.cost() : ta.cost;
        out.push({name:`${ta.name} — ${n.name}`, chance:clamp(ta.ch(n),0.03,0.95),
          desc:ta.desc, outcome:ta.outcome, cost: cst ? costItems(cst) : null,
          note:"연구로 열린 행동",
          disabled: cst ? !resourceSystem.canPayAny(cst) : false, disabledWhy:"자원이 부족하다",
          kind:"spy", tok:{T:n.name}, run:()=>ta.run(n)});
      }
      out.push({name:`첩보 — ${n.name}`, chance:probabilitySystem.calculateSuccessChance("spy",S,n),
        desc:`상대의 군사력과 자원을 조사한다. 현재 정보 수준 ${n.intel}/3.`, outcome:"성공 시 정보 공개 / 실패 시 발각되어 관계 악화", kind:"spy", tok:{T:n.name}, run:()=>explorationSystem.spy(n)});

  }
  if(UI.tab === "탐험"){
    out.push({name:"정찰대를 보낸다", chance:probabilitySystem.calculateSuccessChance("scout",S),
      desc:`미지의 방향으로 사람을 보낸다. 지형: ${S.terrain.n}.`,
      outcome:"성공 시 국가·유적·광맥 발견 / 실패 시 정찰대 손실", kind:"scout", run:()=>explorationSystem.scout()});
    out.push({name:"주변을 정리하며 한 턴 넘긴다", chance:1,
      desc:"아무것도 하지 않고 생산과 회복에 집중한다.", outcome:"사기 소폭 회복", kind:"rest",
      run:()=>{ S.morale = clamp(S.morale+5,0,100); return {msg:"한 턴을 조용히 보냈다. 사기 +5.", chance:1, res:{tier:"성공"}}; }});
    for(const f of FINALS){
      if(S.finals.indexOf(f.id) < 0) continue;
      if(S.finalDone === f.id) continue;
      out.push({name:`최종 테크 선언 — ${f.n}`, chance:1, desc:f.d, kind:"final", tok:{X:f.n},
        outcome:"문명의 방향이 확정되고 엔드게임이 열린다",
        run:()=>{ achieveFinal(f); return {msg:`${f.n}을(를) 달성했다.`, chance:1, res:{tier:"대성공"}}; }});
    }
  }
  return out;
}

/* 앞 글자의 받침에 따라 은/는, 을/를, 이/가, 과/와를 자동으로 고른다 */
const JOSA_MAP = {"은":["은","는"],"는":["은","는"],"을":["을","를"],"를":["을","를"],
                  "이":["이","가"],"가":["이","가"],"과":["과","와"],"와":["과","와"]};
function josaFix(str){
  if(!str) return str;
  // 괄호나 따옴표가 끼어 있어도 그 앞 글자의 받침으로 판정한다 — 예: 규빈국(티타늄)을(를) → …(티타늄)을
  return String(str).replace(/([가-힣0-9A-Za-z])([)\]}»”’"']*)\s?(은\(는\)|는\(은\)|을\(를\)|를\(을\)|이\(가\)|가\(이\)|과\(와\)|와\(과\))/g,
    (m, ch, tail, pair)=>{
      const pairSet = JOSA_MAP[pair[0]];
      let hasJong;
      const code = ch.charCodeAt(0) - 0xAC00;
      if(code >= 0 && code <= 11171) hasJong = (code % 28) !== 0;
      else if(/[0-9]/.test(ch)) hasJong = ["0","1","3","6","7","8"].indexOf(ch) >= 0;
      else hasJong = true;
      return ch + tail + (hasJong ? pairSet[0] : pairSet[1]);
    });
}

const storySystem = {
  tokens(extra){
    const s = sp();
    return Object.assign({
      N: S.nationName, P: PEOPLE[S.species] || "백성", D: S.terrain.n,
      DAY: S.day, PH: S.phase === "밤" ? "밤" : "낮",
      A: S.phase === "밤" ? "달" : "해",
      V: VITALS[s.vital].name, X: "", T: ""
    }, extra || {});
  },
  fill(tpl, tok){ return josaFix(tpl.replace(/\{(\w+)\}/g, (m,k)=> tok[k] !== undefined ? tok[k] : m)); },
  compose(kind, tier, extra){
    const tok = storySystem.tokens(extra);
    const bank = STORY[kind] || STORY.misc;
    const lines = bank[tier] || bank["성공"] || STORY.misc["성공"];
    const body = storySystem.fill(pick(lines), tok);
    const open = rnd() < 0.62 ? storySystem.fill(pick(OPENERS), tok) + " " : "";
    return open + body;
  }
};

/* 선택지에 붙는 "필요 자원" 줄. 부족한 항목은 붉게 표시한다. */
function costItems(cost){
  const map = {wood:["목재", ()=>S.res.wood], stone:["석재", ()=>S.res.stone],
               food:["식량", ()=>S.res.food], metal:["금속(환산)", ()=>resourceSystem.metalValue()],
               liquor:["술", ()=>S.res.liquor], blood:["피", ()=>S.res.blood],
               soul:["영혼", ()=>S.res.soul], power:["동력", ()=>S.res.power]};
  const out = [];
  for(const k in cost){
    if(!map[k] || !cost[k]) continue;
    out.push({n:map[k][0], need:cost[k], have:map[k][1]()});
  }
  return out;
}
function costLine(items){
  if(!items || !items.length) return "";
  return `<div class="costline"><span class="muted">필요</span>` + items.map(it=>{
    const ok = it.have >= it.need;
    return `<span class="${ok?"cost-ok":"cost-no"}">${it.n} <b>${Math.round(it.need)}</b> (보유 ${Math.round(it.have)})</span>`;
  }).join("") + `</div>`;
}

/* 이번 턴 예상 인구 증감 */
function popGrowth(){
  const s = sp(), cap = resourceSystem.popCap();
  if(s.stats.fert <= 0 || S.stats.fert <= 0) return 0;
  let g = S.pop * (S.stats.fert/700) * (S.flags.starved ? -0.8 : 1) * (S.pop < cap ? 1 : -0.4);
  if(S.morale < 25) g -= S.pop*0.004;
  return g;
}

function magicStatus(){
  const mg = M(), out = [];
  if(mg.ward > 0) out.push(`수호 결계 ${mg.ward}회`);
  if(mg.armory > 0) out.push(`무기고 개방 ${mg.armory}회`);
  if(mg.bomb > 0) out.push(`폭약 비축 ${mg.bomb}회`);
  if(S.flags.fallout > 0) out.push(`낙진 ${S.flags.fallout}턴 (식량 생산 -55%)`);
  if(S.flags.fallow) out.push(`휴경 수확 ${S.flags.fallow.t}턴 뒤 식량 ${S.flags.fallow.amt}`);
  if(mg.fire > 0) out.push(`불의 인장 ${mg.fire}회`);
  if(mg.foresight > 0) out.push(`예지 ${mg.foresight}회`);
  if(mg.scoutBoost > 0) out.push(`땅의 기억 ${mg.scoutBoost}턴`);
  const broken = S.nations.filter(n=>n.discovered && n.defBroken > 0).map(n=>`${n.name} 성벽 ${n.defBroken}턴`);
  out.push.apply(out, broken);
  return out.length ? `<div class="tiny k-mag" style="margin-top:6px">진행 중 — ${out.join(" · ")}</div>` : "";
}

function situationText(){
  const s = sp();
  const parts = [];
  if(S.turn === 1) parts.push(`${S.nationName}이라 이름 붙인 ${s.name}의 무리가 ${S.terrain.n}에 자리를 잡았다. 첫 결정이 남은 전부를 가른다.`);
  else if(S.phase === "밤") parts.push("해가 졌다. " + (s.night>0 ? "이제 우리의 시간이다." : "불을 피우고 하루를 마무리한다."));
  else parts.push("아침 안개가 걷혔다. " + (S.species==="vampire"||S.species==="lich" ? "낮은 언제나 견디는 시간이다." : "할 일이 쌓여 있다."));
  if(S.morale < 25) parts.push("사기가 바닥이다. 사람들이 명령을 흘려듣는다.");
  const starv = S.res.food < speciesSystem.foodNeed()*2 && s.food>0;
  if(starv) parts.push("창고가 비어간다.");
  if(S.species==="elf" && S.res.sun < 35 && S.mods.sunNeed > -1) parts.push("잎맥이 마르고 있다. 볕이 필요하다.");
  const atWar = S.nations.filter(n=>n.war && !n.conquered);
  if(atWar.length) parts.push(`${atWar.map(n=>n.name).join(", ")}과(와) 전쟁 중이다.`);
  return parts.join(" ");
}

/* ---------------------- profileSystem: 한 기기에서 계정 나누기 ---------------------- */
const LS = {
  profiles: "civbook_profiles",
  current:  "civbook_current",
  slots:    p => `civbook_slots::${p}`,
  unlocks:  p => `civbook_unlocks::${p}`
};
const profileSystem = {
  read(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  all(){ return profileSystem.read(LS.profiles, []); },
  current(){
    let c = null;
    try{ c = localStorage.getItem(LS.current); }catch(e){}
    const all = profileSystem.all();
    if(c && all.indexOf(c) >= 0) return c;
    return all.length ? all[0] : null;
  },
  select(name){ try{ localStorage.setItem(LS.current, name); }catch(e){} },
  create(name){
    name = (name || "").trim().slice(0, 14) || "플레이어";
    const all = profileSystem.all();
    let nm = name, i = 2;
    while(all.indexOf(nm) >= 0){ nm = `${name} ${i++}`; }
    all.push(nm); profileSystem.write(LS.profiles, all); profileSystem.select(nm);
    return nm;
  },
  remove(name){
    const all = profileSystem.all().filter(x => x !== name);
    profileSystem.write(LS.profiles, all);
    try{ localStorage.removeItem(LS.slots(name)); localStorage.removeItem(LS.unlocks(name)); }catch(e){}
    if(all.length) profileSystem.select(all[0]);
    else profileSystem.create("플레이어 1");
  },
  /* 첫 실행, 또는 구버전 저장본을 쓰던 사람을 위한 이관 */
  ensure(){
    if(!profileSystem.all().length){
      const nm = profileSystem.create("플레이어 1");
      try{
        const oldSave = localStorage.getItem("civbook_save_v6");
        if(oldSave){
          const obj = JSON.parse(oldSave);
          profileSystem.write(LS.slots(nm), [{
            id: Date.now(), at: new Date().toISOString(),
            meta: saveSystem.metaOf(obj), data: oldSave
          }]);
        }
        const oldUnlock = localStorage.getItem("civbook_unlocks");
        if(oldUnlock) localStorage.setItem(LS.unlocks(nm), oldUnlock);
      }catch(e){}
    }
    return profileSystem.current();
  }
};

/* ---------------------- saveSystem: 여러 시점을 남긴다 ---------------------- */
const MAX_SLOTS = 12;
const saveSystem = {
  metaOf(obj){
    try{
      return {name: obj.nationName, species: (SPECIES_BY_ID[obj.species]||{}).name || "?",
              day: obj.day, turn: obj.turn, pop: Math.round(obj.pop),
              tier: TIERS[(function(){ const keep = S; S = obj; const t = civTier(); S = keep; return t; })()],
              diff: (DIFFS.find(d=>d.id===obj.diff)||DIFFS[0]).n};
    }catch(e){ return {name:"?", species:"?", day:obj.day||0, turn:obj.turn||0, pop:0, tier:"?", diff:"?"}; }
  },
  slots(){ return profileSystem.read(LS.slots(profileSystem.ensure()), []); },
  writeSlots(arr){ return profileSystem.write(LS.slots(profileSystem.ensure()), arr); },
  save(){
    // 선택형 사건은 함수(확률식·결과 처리)를 품고 있어 직렬화되지 않는다.
    // 저장했다가 불러오면 선택지가 빈 껍데기가 되므로 아예 막는다.
    if(S.pending){
      uiSystem.modal("<h2>지금은 저장할 수 없다</h2><p>진행 중인 사건을 먼저 처리해라. 선택이 끝나면 저장할 수 있다.</p>");
      return false;
    }
    try{
      const arr = saveSystem.slots();
      const data = JSON.stringify(S);
      arr.unshift({id: Date.now(), at: new Date().toISOString(), meta: saveSystem.metaOf(S), data});
      // 오래된 기록부터 밀려난다. 최근 12개 시점이 남는다.
      if(arr.length > MAX_SLOTS) arr.length = MAX_SLOTS;
      if(!saveSystem.writeSlots(arr)) throw new Error("write failed");
      log(`${S.day}일차 시점을 저장했다. (기록 ${arr.length}/${MAX_SLOTS})`, "good");
      uiSystem.renderAll();
      return true;
    }catch(e){ uiSystem.modal("<h2>저장 실패</h2><p>브라우저 저장 공간을 사용할 수 없다. 시크릿 모드라면 일반 창에서 다시 시도해라. 기록이 너무 많다면 오래된 것을 지워봐라.</p>"); return false; }
  },
  remove(id){
    saveSystem.writeSlots(saveSystem.slots().filter(x => x.id !== id));
  },
  load(id){
    try{
      const arr = saveSystem.slots();
      const slot = (id === undefined) ? arr[0] : arr.find(x => x.id === id);
      if(!slot) return false;
      const obj = JSON.parse(slot.data);
      if(!obj || obj.ver !== 6) return false;
      S = obj;
      // 누락 필드 보정
      S.mods = Object.assign({food:0,wood:0,stone:0,metal:0,liquor:0,blood:0,research:0,trade:0,build:0,
        disaster:0,plague:0,quake:0,collapse:0,sunNeed:0,dayPen:0,upkeep:0,popcap:0,scout:0,spy:0,siege:0,trust:0,morale:0}, S.mods||{});
      // 옛 저장본에 사건이 남아 있으면 껍데기만 남으므로 지운다
      if(S.pending && (!S.pending.options || !S.pending.options.some(o => typeof o.run === "function"))){
        S.pending = null;
      }
      return true;
    }catch(e){ return false; }
  },
  has(){ return saveSystem.slots().length > 0; },
  /* 저장 기록 목록을 띄우고 고르게 한다 */
  browse(afterLoad){
    const arr = saveSystem.slots();
    if(!arr.length){
      uiSystem.modal("<h2>저장된 기록이 없다</h2><p>게임 중 저장 버튼을 누르면 그 시점이 여기에 쌓인다.</p>");
      return;
    }
    const rows = arr.map(sl=>{
      const t = new Date(sl.at);
      const when = `${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,"0")}.${String(t.getDate()).padStart(2,"0")} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
      const m = sl.meta || {};
      return `<div class="techrow" style="display:flex;gap:8px;align-items:center;justify-content:space-between">
        <div style="min-width:0">
          <b>${m.name || "?"}</b> <span class="tiny muted">${m.species || ""} · ${m.diff || ""}</span>
          <div class="tiny">${m.day || 0}일차 · ${m.tier || "?"} · 인구 ${m.pop || 0}</div>
          <div class="tiny muted">${when}</div>
        </div>
        <div class="row" style="flex-wrap:nowrap">
          <button class="btn small" data-load="${sl.id}">불러오기</button>
          <button class="btn small" data-del="${sl.id}">삭제</button>
        </div></div>`;
    }).join("");
    uiSystem.modal(`<h2>저장 기록 — ${profileSystem.ensure()}</h2>
      <p class="small muted">최근 ${MAX_SLOTS}개 시점이 남는다. 되돌아갈 지점을 고르면 된다.</p>
      <div class="scroller">${rows}</div>`, (body)=>{
        body.querySelectorAll("[data-load]").forEach(btn=>{
          btn.onclick = ()=>{
            const id = Number(btn.getAttribute("data-load"));
            if(saveSystem.load(id)){
              uiSystem.lastResult = null;
              document.getElementById("modal").close && document.getElementById("modal").close();
              document.getElementById("modal").removeAttribute("open");
              if(afterLoad) afterLoad();
              else uiSystem.renderAll();
            }
          };
        });
        body.querySelectorAll("[data-del]").forEach(btn=>{
          btn.onclick = ()=>{
            saveSystem.remove(Number(btn.getAttribute("data-del")));
            saveSystem.browse(afterLoad);
          };
        });
      });
  }
};

/* ---------------------- 시작 화면 ---------------------- */
function randomSeed(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<7;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
let selectedDiff = "normal";
function renderDiffs(){
  const g = document.getElementById("diffGrid");
  g.innerHTML = "";
  for(const d of DIFFS){
    const btn = document.createElement("button");
    btn.className = "species";
    btn.setAttribute("aria-pressed", selectedDiff === d.id ? "true" : "false");
    btn.innerHTML = `<div class="nm">${d.n}</div><div class="small muted">${d.d}</div>
      <div class="tiny muted" style="margin-top:5px">자원 ×${d.res.toFixed(2)} · 연구 ×${d.research.toFixed(2)} · 적대 ×${d.hostility.toFixed(2)} · 소모 ×${d.upkeep.toFixed(2)}</div>`;
    btn.onclick = ()=>{ selectedDiff = d.id; renderDiffs(); };
    g.appendChild(btn);
  }
}
function renderProfile(){
  const cur = profileSystem.ensure();
  document.getElementById("profNow").textContent = cur;
  const slots = saveSystem.slots();
  const un = unlockedSpecies().length;
  document.getElementById("profInfo").textContent =
    `저장 기록 ${slots.length}개 · 히든 종족 해금 ${un}종`;
}
function profileDialog(){
  const all = profileSystem.all(), cur = profileSystem.current();
  const rows = all.map(nm=>`<div class="techrow" style="display:flex;gap:8px;align-items:center;justify-content:space-between">
      <div><b>${nm}</b>${nm===cur?' <span class="badge">사용 중</span>':''}
      <div class="tiny muted">기록 ${profileSystem.read(LS.slots(nm),[]).length}개 · 해금 ${profileSystem.read(LS.unlocks(nm),[]).length}종</div></div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="btn small" data-sel="${nm}">선택</button>
        ${all.length>1?`<button class="btn small" data-del="${nm}">삭제</button>`:""}
      </div></div>`).join("");
  uiSystem.modal(`<h2>계정 선택</h2><div class="scroller">${rows}</div>
    <p class="tiny muted" style="margin-top:8px">계정을 지우면 그 계정의 저장 기록과 해금도 함께 사라진다.</p>`, (body)=>{
      body.querySelectorAll("[data-sel]").forEach(b=>{ b.onclick = ()=>{
        profileSystem.select(b.getAttribute("data-sel"));
        document.getElementById("modal").removeAttribute("open");
        if(document.getElementById("modal").close) document.getElementById("modal").close();
        renderSetup();
      };});
      body.querySelectorAll("[data-del]").forEach(b=>{ b.onclick = ()=>{
        profileSystem.remove(b.getAttribute("data-del"));
        profileDialog(); renderSetup();
      };});
    });
}
function renderSetup(){
  renderProfile();
  renderDiffs();
  const unlocked = unlockedSpecies();
  const grid = document.getElementById("speciesGrid");
  grid.innerHTML = "";
  for(const s of SPECIES){
    const locked = s.hidden && unlocked.indexOf(s.id) < 0;
    const btn = document.createElement("button");
    btn.className = "species" + (locked ? " locked":"");
    btn.setAttribute("aria-pressed", UI.selectedSpecies===s.id ? "true":"false");
    btn.disabled = locked;
    btn.innerHTML = locked
      ? `<div class="nm">??? <span class="badge">히든</span></div><div class="small muted">${s.unlockText}</div>`
      : `<div class="nm">${s.name} <span class="badge">${s.tag}</span></div>
         <div class="small muted">${s.desc}</div>
         <div class="tiny" style="margin-top:6px">필수 생존 자원 — <b>${VITALS[s.vital].name}</b></div>`;
    btn.onclick = ()=>{ UI.selectedSpecies = s.id; renderSetup(); };
    grid.appendChild(btn);
  }
  const d = document.getElementById("speciesDetail");
  if(!UI.selectedSpecies){
    d.innerHTML = `<p class="muted small" style="margin:0">종족을 고르면 능력치와 장단점이 여기에 펼쳐진다. 종족 차이는 확률 계산에 직접 들어간다.</p>`;
  }else{
    const s = SPECIES_BY_ID[UI.selectedSpecies];
    d.innerHTML = `
      <h3>${s.name} — ${VITALS[s.vital].name}에 목숨을 건다</h3>
      <div class="kv" style="margin:6px 0">
        ${STAT_META.map(([k,n])=>`<span class="muted">${n}</span><span><b>${s.stats[k]}</b></span>`).join("")}
      </div>
      <div class="small"><b>강점</b><ul style="margin:.2rem 0 .4rem 1.1rem;padding:0">${s.pros.map(p=>`<li>${p}</li>`).join("")}</ul></div>
      <div class="small"><b>약점</b><ul style="margin:.2rem 0 0 1.1rem;padding:0">${s.cons.map(p=>`<li>${p}</li>`).join("")}</ul></div>
      <div class="tiny muted" style="margin-top:8px">${VITALS[s.vital].desc}</div>`;
  }
  document.getElementById("startBtn").disabled = !UI.selectedSpecies;
  document.getElementById("loadBtn").style.display = saveSystem.has() ? "" : "none";
}
const NAME_A = ["서리","붉은","검은","여명","황혼","안개","무쇠","푸른","깊은","첫","마지막","은빛"];
const NAME_B = ["늪","산","강","숲","재","달","해","골짜기","성","바람","불","돌"];
const NAME_C = ["연맹","왕국","부족","공동체","공국","자치령","일족","연방"];
function randomNationName(){ return `${pick2(NAME_A)}${pick2(NAME_B)} ${pick2(NAME_C)}`; }
function pick2(a){ return a[Math.floor(Math.random()*a.length)]; }
function startGame(){
  const seed = (document.getElementById("seedInput").value || randomSeed()).toUpperCase().trim();
  const nm = document.getElementById("nameInput").value.trim() || randomNationName();
  gameState.create(UI.selectedSpecies, seed, nm, selectedDiff);
  uiSystem.lastResult = null;
  enterGame();
}
function enterGame(){
  document.getElementById("setup").style.display = "none";
  document.getElementById("game").style.display = "block";
  applyMobileTab();
  uiSystem.renderAll();
}

/* ---------------------- 모바일 탭 ---------------------- */
function mq(q){
  try{ return typeof window.matchMedia === "function" ? window.matchMedia(q).matches : false; }
  catch(e){ return false; }
}
function applyMobileTab(){
  const small = mq("(max-width:920px)") || window.innerWidth <= 920;
  const map = {left:"colLeft", center:"colCenter", right:"colRight"};
  for(const k in map) document.getElementById(map[k]).classList.toggle("hide-m", small && UI.mtab!==k && !(UI.mtab==="log" && k==="center"));
  const logCard = document.getElementById("logCard");
  if(small && UI.mtab==="log"){
    document.getElementById("colCenter").classList.remove("hide-m");
    logCard.style.display = "";
    document.querySelector("#colCenter .card").style.display = "none";
  }else{
    const first = document.querySelector("#colCenter .card");
    if(first) first.style.display = "";
    logCard.style.display = small && UI.mtab!=="center" ? "none" : "";
  }
  document.querySelectorAll(".mobile-tabs .tab").forEach(t=>
    t.setAttribute("aria-selected", t.dataset.m===UI.mtab ? "true":"false"));
}

/* ---------------------- 이벤트 바인딩 ---------------------- */
document.getElementById("seedInput").value = randomSeed();
document.getElementById("nameInput").value = randomNationName();
document.getElementById("reseedBtn").onclick = ()=>{ document.getElementById("seedInput").value = randomSeed(); };
document.getElementById("renameBtn").onclick = ()=>{ document.getElementById("nameInput").value = randomNationName(); };
document.getElementById("startBtn").onclick = startGame;
document.getElementById("loadBtn").onclick = ()=> saveSystem.browse(()=>{ enterGame(); });
document.getElementById("profSwitch").onclick = profileDialog;
document.getElementById("profNew").onclick = ()=>{
  uiSystem.modal(`<h2>새 계정</h2><p class="small muted">이름을 정해라. 기록과 해금이 따로 관리된다.</p>
    <div class="row"><input type="text" id="newProfName" size="16" maxlength="14" placeholder="예: 동생">
    <button class="btn primary" id="newProfOk">만들기</button></div>`, (body)=>{
      body.querySelector("#newProfOk").onclick = ()=>{
        profileSystem.create(body.querySelector("#newProfName").value);
        document.getElementById("modal").removeAttribute("open");
        if(document.getElementById("modal").close) document.getElementById("modal").close();
        renderSetup();
      };
    });
};
document.getElementById("saveBtn").onclick = ()=> saveSystem.save();
document.getElementById("loadBtn2").onclick = ()=> saveSystem.browse();
document.getElementById("restartBtn").onclick = ()=>{
  document.getElementById("game").style.display = "none";
  document.getElementById("setup").style.display = "flex";
  renderSetup();
};
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = mq("(prefers-color-scheme: dark)");
  const next = cur ? (cur==="dark"?"light":"dark") : (dark?"light":"dark");
  document.documentElement.setAttribute("data-theme", next);
}
document.getElementById("themeBtn").onclick = toggleTheme;
document.getElementById("themeBtn2").onclick = toggleTheme;
document.getElementById("modalClose").onclick = ()=>{
  const m = document.getElementById("modal");
  if(typeof m.close === "function") m.close(); else m.removeAttribute("open");
};
document.querySelectorAll(".mobile-tabs .tab").forEach(t=>{
  t.onclick = ()=>{ UI.mtab = t.dataset.m; applyMobileTab(); };
});
window.addEventListener("resize", ()=>{ if(S) applyMobileTab(); });

renderSetup();
</script>
</body>
</html>
