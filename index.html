/* ---------------------- resourceSystem ---------------------- */
const resourceSystem = {
  popCap(){ return S.popCapBase + b("house")*45 + S.mods.popcap; },
  metalTotal(){ let t=0; for(const k in S.metals) t += S.metals[k]; return t; },
  /* 등급이 높은 금속은 같은 일을 더 적은 양으로 해낸다 (METALS.cost = 단위당 가치) */
  metalValue(){ let v=0; for(const k in S.metals) v += S.metals[k] * (METAL_BY_ID[k] ? METAL_BY_ID[k].cost : 1); return v; },
  bestMetal(){
    let best = null;
    for(const m of METALS){ if((S.metals[m.id]||0) >= 5 && (!best || m.rare > best.rare)) best = m; }
    return best;
  },
  gainMetal(id, amt){
    S.metals[id] = (S.metals[id]||0) + amt;
    if(!S.metalsSeen) S.metalsSeen = [];
    if(S.metals[id] >= 5 && S.metalsSeen.indexOf(id) < 0) S.metalsSeen.push(id);
  },
  /* 금속 소비: 값싼 금속부터, 등급별 가치를 반영해 차감한다 */
  spendMetal(amt){
    let left = amt;
    const order = METALS.slice().sort((a,b2)=>a.rare-b2.rare);
    for(const m of order){
      if(left <= 0.001) break;
      const have = S.metals[m.id] || 0;
      if(have <= 0) continue;
      const worth = have * m.cost;                  // 이 금속이 감당할 수 있는 가치
      const useValue = Math.min(worth, left);
      S.metals[m.id] = have - useValue / m.cost;
      left -= useValue;
    }
    return left <= 0.001;
  },
  /* 생존 자원까지 포함해 어떤 자원이든 확인·지불한다 */
  canPayAny(cost){
    for(const k in cost){
      if(!cost[k]) continue;
      if(k === "metal"){ if(resourceSystem.metalValue() < cost[k]) return false; }
      else if((S.res[k] || 0) < cost[k]) return false;
    }
    return true;
  },
  payAny(cost){
    for(const k in cost){
      if(!cost[k]) continue;
      if(k === "metal") resourceSystem.spendMetal(cost[k]);
      else S.res[k] = Math.max(0, (S.res[k] || 0) - cost[k]);
    }
  },
  canPay(cost){
    if(cost.wood && S.res.wood < cost.wood) return false;
    if(cost.stone && S.res.stone < cost.stone) return false;
    if(cost.metal && resourceSystem.metalValue() < cost.metal) return false;
    if(cost.food && S.res.food < cost.food) return false;
    if(cost.sci) return true;
    return true;
  },
  pay(cost){
    if(cost.wood) S.res.wood -= cost.wood;
    if(cost.stone) S.res.stone -= cost.stone;
    if(cost.food) S.res.food -= cost.food;
    if(cost.metal) resourceSystem.spendMetal(cost.metal);
  },
  buildCost(bd){
    const n = b(bd.id);
    const mult = (1 + n*0.5) * (S.species==="dwarf" ? 0.82 : 1);
    const c = {};
    for(const k in bd.cost) c[k] = Math.round(bd.cost[k]*mult);
    return c;
  },
  /* 매 턴 생산 */
  tick(){
    const A = speciesSystem.activity(), T = S.terrain;
    const over = M().overdrive > 0 ? 2 : 1;
    const prodF = (1 + effStat("prod")/130) * (1 + mt("prod")) * (1 + popTier().prod) * popLabor() * DF().res * over;
    const dim = n => n > 0 ? Math.pow(n, 0.78) : 0;          // 같은 건물을 더 지어도 효율은 점점 떨어진다
    const wood = (0.8 + dim(b("lumber"))*1.7) * T.wood * prodF * (1+S.mods.wood) * A;
    const stone = (0.6 + dim(b("quarry"))*1.5) * T.stone * prodF * (1+S.mods.stone) * A;
    const metal = (dim(b("mine"))*0.75) * T.metal * (1 + effStat("mine")/150) * (1+S.mods.metal) * A;
    S.res.wood += wood; S.res.stone += stone;
    if(metal > 0){
      const pool = technologySystem.availableMetals();
      const m = pool.length ? pool[Math.min(pool.length-1, Math.floor(rnd()*rnd()*pool.length))] : null;
      if(m) resourceSystem.gainMetal(m.id, metal);
    }
    const s = sp();
    if(s.food > 0){
      const fall = (S.flags.fallout > 0) ? 0.45 : 1;   // 낙진이 내린 땅에서는 아무것도 제대로 자라지 않는다
      const food = (2.8 + dim(b("farm"))*2.9 + b("garden")*1.0) * T.food * (1 + effStat("agri")/80) * (1+S.mods.food) * A * fall;
      S.res.food += food;
    }
    // 생존 자원 자동 생산 (인구가 일부를 스스로 조달한다)
    const popAid = S.pop * 0.012;
    if(s.vital === "liquor") S.res.liquor += (1.0 + popAid + b("farm")*0.4) * (1+S.mods.liquor) * A;
    if(s.vital === "blood")  S.res.blood  += (0.9 + popAid + b("farm")*0.35) * (1+S.mods.blood) * A;
    if(s.vital === "soul")   S.res.soul   += (2.0 + popAid*1.4 + b("temple")*0.8 + b("tower")*0.5) * Math.max(0.8, A);
    if(s.vital === "power"){
      // 금속을 태우는 것이 기본, 없으면 석재로 버티고, 그마저 없어도 최소 출력은 돈다
      if(resourceSystem.spendMetal(0.6)) S.res.power += (2.6 + popAid*1.2 + b("mine")*0.4) * Math.max(0.8, A);
      else if(S.res.stone >= 3){ S.res.stone -= 3; S.res.power += (1.6 + popAid*0.8) * Math.max(0.8, A); }
      else S.res.power += 1.0 * Math.max(0.8, A);
    }
    if(s.vital === "gold"){
      // 드래곤 혈족: 조공과 채굴로 보물이 저절로 쌓인다
      const tribute = S.nations.filter(n => (n.vassal || n.conquered) && !n.absorbed).length * 0.25;
      resourceSystem.gainMetal("gold", (0.25 + popAid*0.25 + b("mine")*0.18 + b("vault")*0.4 + tribute) * A);
    }
    if(S.species === "elf"){
      if(S.phase === "낮") S.res.sun = Math.min(100, S.res.sun + 14 + b("garden")*12);
    }
    resourceSystem.upkeep();
  },
  upkeep(){
    const s = sp();
    let starving = false;
    // 건물과 상비군 유지비 — 벌린 판이 클수록 매 턴 빠져나간다
    let bCount = 0; for(const k in S.buildings) bCount += S.buildings[k];
    const upMul = DF().upkeep * Math.max(0.5, 1 + S.mods.upkeep);
    // 처음 8채와 군사력 25까지는 유지비가 들지 않는다. 자리를 잡기 전에는 숨통을 틔워준다.
    const needWood = Math.max(0, bCount - 8) * 0.30 * upMul;
    const needStone = Math.max(0, bCount - 8) * 0.18 * upMul;
    const needArmy = Math.max(0, S.stats.mil - 25) * 0.045 * upMul;
    let neglected = false;
    if(S.res.wood >= needWood) S.res.wood -= needWood; else { S.res.wood = 0; neglected = true; }
    if(S.res.stone >= needStone) S.res.stone -= needStone; else { S.res.stone = 0; neglected = true; }
    const armyKey = s.food > 0 ? "food" : s.vital;
    if((S.res[armyKey]||0) >= needArmy) S.res[armyKey] -= needArmy;
    else { S.res[armyKey] = 0; S.stats.mil = Math.max(4, S.stats.mil - 1.2); neglected = true; }
    if(neglected){
      S.morale = clamp(S.morale - 3, 0, 100);
      const keys = Object.keys(S.buildings).filter(k => S.buildings[k] > 0);
      if(keys.length && rnd() < 0.07){
        const k = pick(keys); S.buildings[k]--;
        log(`유지비를 대지 못해 ${BUILD_BY_ID[k].name} 하나가 버려졌다.`, "bad");
      }
    }
    if(s.food > 0){
      const need = speciesSystem.foodNeed();
      if(S.res.food >= need){ S.res.food -= need; }
      else { S.res.food = 0; starving = true; }
    }
    if(s.vital === "sun"){
      const need = Math.max(0, 1 + S.mods.sunNeed);
      S.res.sun = clamp(S.res.sun - 11*need, 0, 100);
      if(S.res.sun < 25 && need > 0) starving = true;
    }else if(s.vital === "gold"){
      const need = speciesSystem.vitalNeed();
      const have = S.metals.gold || 0;
      if(have < need*8){ starving = true; }
    }else{
      const need = speciesSystem.vitalNeed();
      if(S.res[s.vital] >= need) S.res[s.vital] -= need;
      else { S.res[s.vital] = 0; starving = true; }
    }
    // 과잉 팽창 — 다스릴 수 있는 한계를 넘으면 매 턴 사기가 샌다
    const held = S.nations.filter(n=>n.conquered).length + S.nations.filter(n=>n.vassal && !n.conquered).length*0.6;
    const allow = 1 + Math.floor(S.stats.dip/22) + b("temple");
    S.flags.overextend = Math.max(0, held - allow);
    // 사기
    let dm = 1.0 + b("temple")*2 + S.mods.morale + (b("vault")?1:0) - S.flags.overextend*0.9;
    if(starving) dm -= 4.5;
    if(S.morale > 75) dm -= 0.6;
    S.morale = clamp(S.morale + dm, 0, 100);
    // 인구
    const cap = resourceSystem.popCap();
    let growth = 0;
    if(s.stats.fert > 0 && S.stats.fert > 0){
      growth = S.pop * (S.stats.fert/700) * (starving ? -0.8 : 1) * (S.pop < cap ? 1 : -0.4);
      if(S.morale < 25) growth -= S.pop*0.004;
    }else{
      // 번식하지 않는 종족: 생존 자원이 남아돌면 조립·소생으로 인원을 늘린다
      const vres = s.vital==="gold" ? (S.metals.gold||0) : (S.res[s.vital]||0);
      const need = Math.max(0.5, speciesSystem.vitalNeed());
      if(!starving && vres > need*14 && S.pop < cap){ growth = S.pop*0.01 + 0.6; S.res[s.vital] -= need*2; }
      else if(starving) growth = -S.pop*0.008;
    }
    S.pop = Math.max(0, S.pop + growth);
    S.flags.starved = starving;
    S.flags.neglected = neglected;
    if(starving) log(`${VITALS[s.vital].name}이(가) 모자라 문명이 흔들린다.`, "bad");
    // 사기 붕괴가 이어지면 내전으로 번진다
    if(S.morale <= 18) S.flags.lowMorale = (S.flags.lowMorale || 0) + 1;
    else S.flags.lowMorale = 0;
    if(S.flags.lowMorale >= 5 && !S.pending){
      S.flags.lowMorale = 0;
      const rebels = Math.round(S.pop * 0.3);
      S.pending = {
        title: "내전",
        text: `굶주림과 불신이 임계점을 넘었다. ${Math.round(rebels)}명이 성문 앞에 모여 다른 깃발을 들었다.`,
        options: [
          {label:"무력으로 진압한다", chanceFn:()=>clamp(0.3 + effStat("mil")/160, 0.05, 0.9),
           hint:"성공 시 질서 회복 / 실패 시 인구 대량 손실",
           run(ok){ if(ok){ S.pop -= rebels*0.3; S.morale = clamp(S.morale+25,0,100);
               return `봉기를 눌렀다. 인구 -${Math.round(rebels*0.3)}, 사기 +25.`; }
             S.pop -= rebels*0.8; S.morale = clamp(S.morale-10,0,100);
             const keys = Object.keys(S.buildings).filter(k=>S.buildings[k]>0);
             if(keys.length){ const k=pick(keys); S.buildings[k]--; }
             return `진압에 실패했다. 인구 -${Math.round(rebels*0.8)}, 건물 하나 소실.`; }},
          {label:"창고를 열어 달랜다", chanceFn:()=>1,
           hint:"자원을 대량으로 잃지만 사람은 지킨다",
           run(){ S.res.wood *= 0.5; S.res.stone *= 0.5; if(sp().food>0) S.res.food *= 0.4;
             S.morale = clamp(S.morale+30,0,100);
             return "창고를 열었다. 비축의 절반이 사라졌고 사람들은 흩어졌다. 사기 +30."; }},
          {label:"떠나려는 자들을 보내준다", chanceFn:()=>1,
           hint:"인구의 30%를 잃고 사기를 회복한다",
           run(){ S.pop -= rebels; S.morale = clamp(S.morale+35,0,100);
             return `${Math.round(rebels)}명이 문명을 떠났다. 남은 자들의 사기는 올랐다.`; }}
        ]
      };
      log("내전이 터졌다.", "bad");
    }
    // 마지막 불씨: 멸망 직전에 한 번, 회복할 기회를 준다
    if(S.pop > 0 && S.pop < 7 && !S.flags.lastEmber && !S.pending){
      S.flags.lastEmber = true;
      S.pop = Math.max(S.pop, 5);
      S.pending = {
        title: "마지막 불씨",
        text: "남은 사람이 한 줌이다. 지금 내리는 결정이 문명의 존속을 가른다.",
        options: [
          {label:"모든 것을 버리고 안전한 곳으로 옮긴다", chanceFn:()=>0.8,
           hint:"성공: 인구와 사기 회복 / 실패: 자원만 잃음",
           run(ok){ if(ok){ S.pop += 18; S.morale = clamp(S.morale+35,0,100);
               S.res.wood = Math.max(0,S.res.wood-30); S.res.stone = Math.max(0,S.res.stone-20);
               return "새 터에 다시 자리를 잡았다. 인구 +18, 사기 +35."; }
             S.res.wood = Math.max(0,S.res.wood-20); return "이주 중에 물자를 잃었다. 그래도 사람은 남았다."; }},
          {label:"이웃 국가에 보호를 청한다", chanceFn:()=>clamp(0.3+effStat("dip")/120,0.1,0.9),
           hint:"성공: 인구와 자원 지원 / 실패: 자존심만 상함",
           run(ok){ const n = S.nations.filter(x=>x.discovered&&!x.war)[0];
             if(ok && n){ S.pop += 25; S.res.food += 60; n.attitude = clamp(n.attitude+20,-100,100);
               return `${n.name}이(가) 유민과 식량을 보내왔다. 인구 +25, 식량 +60.`; }
             S.morale = clamp(S.morale-5,0,100); return "손을 내미는 나라는 없었다."; }},
          {label:"땅을 지키며 버틴다", chanceFn:()=>clamp(0.35+effStat("mil")/150,0.1,0.9),
           hint:"성공: 사기 대폭 회복과 능력치 상승 / 실패: 더 줄어듦",
           run(ok){ if(ok){ S.pop += 10; S.morale = 85; S.stats.mil += 6;
               return "남은 자들이 서로를 붙들었다. 인구 +10, 사기 85, 군사력 +6."; }
             S.pop = Math.max(1, S.pop-2); return "버텼지만 더 줄었다."; }}
        ]
      };
      log("인구가 한 줌만 남았다. 문명의 존속이 걸린 결정이 필요하다.", "warn");
    }
    if(S.pop < 1 && !S.gameOver){
      S.gameOver = true;
      log("마지막 한 사람이 눈을 감았다. 문명의 서는 여기서 끊긴다.", "bad");
    }
  }
};

/* ---------------------- technologySystem ---------------------- */
const technologySystem = {
  availableMetals(){
    const out = [];
    for(const m of METALS){
      if(S.metalUnlocked.indexOf(m.id) < 0) continue;
      let req = m.tier;
      if(S.species === "dwarf") req = Math.max(0, req-1);
      if(civTier() >= req) out.push(m);
    }
    return out.sort((a,b2)=>a.rare-b2.rare);
  },
  applyTech(t){
    if(t.eff) for(const k in t.eff) S.stats[k] += t.eff[k];
    if(t.mod) for(const k in t.mod) S.mods[k] = (S.mods[k]||0) + t.mod[k];
    if(t.unlockMetal) for(const id of t.unlockMetal) if(S.metalUnlocked.indexOf(id)<0) S.metalUnlocked.push(id);
  },
  canSee(t){
    if(t.banSpecies && t.banSpecies.indexOf(S.species)>=0) return false;
    if(S.species==="lich" && t.f==="농업" && t.id!=="brew1") return false;
    if(t.hidden) return S.techVisible.indexOf(t.id) >= 0;
    return true;
  },
  preOk(t){ return t.pre.every(p => has(p)); },
  refreshVisible(){
    // 히든 기술 해금 조건 점검
    const reveal = id => { if(S.techVisible.indexOf(id)<0){ S.techVisible.push(id);
      log(`잊혀진 지식의 실마리를 잡았다 — 히든 기술 ‘${TECH_BY_ID[id].n}’ 해금.`, "mag"); } };
    if(S.counters.ruins >= 1) reveal("h_ruin");
    if(S.counters.betrays >= 3) reveal("h_court");
    if(has("h_ruin") && S.stats.mag >= 55 && has("mag3")) reveal("h_dragon");
    if(civTier() >= 7 && has("sci4") && has("mag4")) reveal("h_void");
    if(S.flags.abyss) reveal("h_abyss");
  },
  researchCost(t){
    const disc = 1 - Math.min(0.3, b("lab")*0.05);
    const c = {};
    for(const k in t.cost) c[k] = Math.round(t.cost[k]*disc);
    return c;
  },
  research(t){
    const c = technologySystem.researchCost(t);
    const chance = probabilitySystem.calculateSuccessChance("research", S, t);
    const pay = {wood:c.wood||0, stone:c.stone||0, metal:c.metal||0};
    resourceSystem.pay(pay);
    S.flags.researchBoost = false;   // 사전 실험 효과는 한 번의 연구에만 쓰인다
    const roll = rnd();
    if(roll < chance){
      S.techs.push(t.id);
      technologySystem.applyTech(t);
      log(`연구 성공 — ${t.n}. ${t.d}`, "good");
      if(t.id === "h_dragon") unlockSpeciesGlobal("dragonkin");
      technologySystem.refreshVisible();
      return {ok:true, msg:`${t.n} 연구에 성공했다. ${t.d}`, chance, res:{tier: roll < chance*0.18 ? "대성공" : "성공", r:roll}};
    }else if(roll < chance + (1-chance)*0.5){
      log(`${t.n} 연구가 벽에 부딪혔다. 자원 일부만 낭비했다.`, "warn");
      return {ok:false, msg:`자료는 남았지만 결론에 닿지 못했다. 다시 시도할 수 있다.`, chance, res:{tier:"부분 성공", r:roll}};
    }else{
      S.morale = clamp(S.morale-3,0,100);
      log(`${t.n} 연구가 실패했다. 사고로 사기가 떨어졌다.`, "bad");
      return {ok:false, msg:`연구 실패. 실험 사고로 사기 -3.`, chance, res:{tier:"실패", r:roll}};
    }
  }
};

/* ---------------------- 문명 등급 ---------------------- */
function civScore(){
  const st = S.stats;
  const techScore = S.techs.length * 26;
  const statScore = (st.mil + st.sci + st.mag + st.prod + st.mine + st.agri + st.dip + st.scout) * 1.6;
  let bCount = 0; for(const k in S.buildings) bCount += S.buildings[k];
  const buildScore = bCount * 16;
  const popScore = S.pop * 0.42;
  let metalScore = 0;
  const seen = S.metalsSeen || [];
  for(const id of seen) if(METAL_BY_ID[id]) metalScore += METAL_BY_ID[id].rare * 10;   // 다뤄본 금속은 기록에 남는다
  for(const id in S.metals) if(S.metals[id] > 4 && seen.indexOf(id) < 0) metalScore += METAL_BY_ID[id].rare * 10;
  const diploScore = S.nations.filter(n=>n.discovered && !n.absorbed).length * 10 + S.counters.trades*4;
  // 한 축만 높아도 최고 등급이 되지 않도록: 각 축 기여 상한
  return Math.round(
    Math.min(techScore, 1300) + Math.min(statScore, 1300) + Math.min(buildScore, 700) +
    Math.min(popScore, 600) + Math.min(metalScore, 570) + Math.min(diploScore, 300)
  );
}
function civTier(){
  const s = civScore();
  let t = 0;
  for(let i=0;i<TIER_REQ.length;i++) if(s >= TIER_REQ[i]) t = i;
  // 상위 등급은 축 균형 요구
  const st = S.stats;
  const balance = Math.min(st.sci+st.mag, st.prod+st.mine) ;
  if(t >= 6 && S.techs.length < 14) t = 5;
  if(t >= 8 && balance < 55) t = 7;
  if(t >= 9 && (!has("smelt5") || S.techs.length < 22)) t = 8;
  return t;
}

/* ---------------------- nationSystem ---------------------- */
const nationSystem = {
  generate(wr){
    // 플레이어와 같은 이름은 빼둔다. 연대기에서 누가 누구인지 헷갈리지 않도록.
    const mine = (S.nationName || "").trim();
    let names = NATION_NAMES.filter(n => n !== mine);
    if(names.length < 14) names = NATION_NAMES.slice();
    // 시드 기반 셔플
    for(let i=names.length-1;i>0;i--){ const j = Math.floor(wr()*(i+1)); [names[i],names[j]]=[names[j],names[i]]; }
    const count = 10 + Math.floor(wr()*5); // 10~14개국
    const tiers = [];
    tiers.push(8); // 가장 강한 국가는 반드시 티타늄
    for(let i=1;i<count;i++){
      const r = wr();
      let t;
      if(r < 0.30) t = 1 + Math.floor(wr()*2);       // 아이언~브론즈
      else if(r < 0.60) t = 3;                        // 실버
      else if(r < 0.80) t = 4 + Math.floor(wr()*2);   // 골드~플레티넘
      else t = 6 + Math.floor(wr()*2);                // 옵시디언~다이아
      tiers.push(clamp(t,1,7));
    }
    for(let i=0;i<count;i++){
      const tier = tiers[i];
      const growCap = 2.4 + wr()*1.4;
      // 등급이 높을수록 국력 격차가 확실하게 벌어진다   // 최종적으로 초기 국력의 2.4~3.8배까지
      const scale = 1 + tier*0.95;
      const disp = DISPOSITIONS[Math.floor(wr()*DISPOSITIONS.length)];
      S.nations.push({
        id: "n"+i,
        name: names[i],
        race: NATION_RACES[Math.floor(wr()*NATION_RACES.length)],
        tier,
        mil: Math.round((10 + wr()*16) * scale),
        sci: Math.round((9 + wr()*14) * scale),
        eco: Math.round((9 + wr()*14) * scale),
        territory: Math.round(2 + wr()*6 + tier),
        stock: {wood: Math.round(30+wr()*90*scale), stone: Math.round(25+wr()*80*scale), metal: Math.round(15+wr()*60*scale)},
        disposition: disp.id,
        rate: 0.6 + wr()*0.9,          // 국가별 성장 속도 (0.6~1.5배)
        growCap, tier0: tier, basePower: 0,
        attitude: Math.round(-12 + wr()*34 + disp.trustBias*0.4),
        discovered: false, intel: 0, ally: false, war: false, treaty: false,
        conquered: false, vassal: false, lastAction: 0, demands: 0, lastDemand: -99, lastTribute: -99
      });
      const nn = S.nations[S.nations.length-1];
      nn.basePower = nn.mil + nn.sci + nn.eco + nn.territory*2;
    }
  },
  disp(n){ return DISPOSITIONS.find(d=>d.id===n.disposition); },
  /* 국가 수가 늘어난 만큼 나라별 도발 빈도는 낮춘다 — 세계 전체의 압력을 일정하게 유지한다 */
  pressure(){ return 8 / Math.max(4, S.nations.length); },

  curPower(n){ return n.mil + n.sci + n.eco + n.territory*2; },
  /* 매 턴 조금씩 자란다. 발견 여부와 무관하게 세계는 굴러간다.
     성장은 초기 국력의 growCap 배에서 멎고, 등급은 어떤 경우에도 티타늄을 넘지 못한다. */
  grow(n){
    if(n.conquered) return;
    if(!n.basePower) n.basePower = nationSystem.curPower(n);
    const d = nationSystem.disp(n);
    const room = clamp(1 - nationSystem.curPower(n)/(n.basePower*(n.growCap||3)), 0, 1);
    if(room <= 0.01) return;
    const g = 0.0062 * n.rate * room * DF().hostility;
    n.mil *= 1 + g * (d.warBias > 0 ? 1.4 : 0.85);
    n.sci *= 1 + g * (d.id === "scheme" || d.id === "proud" ? 1.2 : 1);
    n.eco *= 1 + g * (d.tradeBias > 0 ? 1.4 : 0.9);
    n.stock.wood  = Math.round(n.stock.wood  * (1 + g));
    n.stock.stone = Math.round(n.stock.stone * (1 + g));
    n.stock.metal = Math.round(n.stock.metal * (1 + g));
    if(rnd() < 0.004 * n.rate * room) n.territory++;
    const ratio = nationSystem.curPower(n) / n.basePower;
    // 기본 상한은 티타늄. 다만 후반에, 이미 최상위권이고, 세계에 그런 나라가 하나도 없을 때에 한해
    // 한 나라가 아다만티움까지 올라설 수 있다.
    // 기본 상한은 티타늄. 다만 후반에 이웃을 여럿 삼킨 정복 제국 하나에 한해
    // 아다만티움까지 올라설 수 있다. 세계에 둘은 존재하지 않는다.
    let cap = 8;
    if(S.turn > 180 && (n.absorbedCount || 0) >= 2
       && !S.nations.some(x => x !== n && x.tier >= 9)) cap = 9;
    const spoils = Math.floor((n.absorbedCount || 0) / 3);   // 삼킨 나라의 기반이 그대로 등급이 된다
    const want = clamp((n.tier0 !== undefined ? n.tier0 : n.tier) + Math.floor(Math.log(ratio)/Math.log(1.42)) + spoils, 1, cap);
    if(want !== n.tier){
      const up = want > n.tier;
      const wasNine = want >= 9 && n.tier < 9;
      n.tier = want;
      if(wasNine){
        log(`━━ ${n.name}이(가) 아다만티움 등급에 도달했다. 세계의 저울이 한쪽으로 기울었다. ━━`, "bad");
      }else if(n.discovered) log(up ? `${n.name}이(가) ${TIERS[n.tier]} 등급으로 올라섰다는 소식이 들어왔다.`
                              : `전란에 시달린 ${n.name}이(가) ${TIERS[n.tier]} 등급으로 주저앉았다.`, "warn");
    }
  },
  relName(n){
    if(n.conquered) return {n:"복속", c:"var(--arcane)"};
    if(n.vassal) return {n:"속국", c:"var(--gold)"};
    if(n.war) return {n:"전쟁", c:"var(--danger)"};
    if(n.ally) return {n:"동맹", c:"var(--good)"};
    let out = REL_STATES[0];
    for(const r of REL_STATES) if(n.attitude >= r.min) out = r;
    return out;
  },
  power(n){
    if(!n) return 0;
    // 문명 등급 자체가 전력 배율이다. 티타늄 국가는 우드 부족과 비교할 대상이 아니다.
    return n.mil * (1 + n.tier*0.28) * (1 + n.territory*0.02);
  },
  /* 참전 가능한 동맹 목록과 그들이 실어주는 전력 */
  allyList(exclude){
    return S.nations.filter(n => n.ally && !n.conquered && !n.absorbed && !n.war && n !== exclude && n.attitude >= 20);
  },
  allySupport(exclude){
    let p = 0;
    for(const n of nationSystem.allyList(exclude)){
      const commit = clamp((n.attitude + 20) / 120, 0.2, 1);
      p += nationSystem.power(n) * 0.35 * commit;
    }
    return p;
  },
  /* 적국의 전면 침략: 플레이어가 대응 방식을 고른다 */
  invasion(n){
    if(S.pending || n.conquered) return;
    if(n.lastInvasion && S.turn - n.lastInvasion < Math.round(12 / DF().hostility)) return;   // 같은 나라가 연달아 쳐들어오지는 않는다
    n.lastInvasion = S.turn;
    const power = nationSystem.power(n);
    const tribute = Math.round(25 + power*0.5);
    const holdChance = () => clamp(probabilitySystem.calculateSuccessChance("defend", S, n) + b("wall")*0.05, 0.05, 0.95);
    const fieldChance = () => clamp(probabilitySystem.calculateSuccessChance("war", S, n) * 0.95, 0.05, 0.93);
    S.pending = {
      title: `${n.name}의 침공`,
      text: `${n.name}(${TIERS[n.tier]} 등급)의 병력이 국경을 넘어 진군해 온다. `
          + `척후가 셈한 적의 전력은 약 ${Math.round(power)}, 우리 전력은 약 ${Math.round(battleSystem.playerPower())}`
          + (nationSystem.allySupport(n) > 0
              ? `이며, ${nationSystem.allyList(n).map(a=>a.name).join(", ")}의 지원군 약 ${Math.round(nationSystem.allySupport(n))}이 이미 방어선에 합류해 있다. `
              : `이다. `)
          + `대응을 정해야 한다.`,
      options: [
        {label:"성벽 뒤에서 농성한다", chanceFn:holdChance,
         hint:"성벽이 있을수록 유리하다. 성공 시 격퇴, 실패 시 외곽 상실",
         run(ok){
           if(ok){ n.mil = Math.round(n.mil*0.82); S.morale = clamp(S.morale+10,0,100);
             if(rnd() < 0.55){ n.war = false; n.attitude = clamp(n.attitude+10,-100,100);
               return `공성은 무위로 끝났다. ${n.name}은(는) 군을 물렸다.`; }
             return "성문은 버텼다. 적은 물러갔지만 다시 올 것이다."; }
           const loss = Math.max(3, S.pop*0.06);
           S.pop -= loss; S.res.wood = Math.max(0,S.res.wood-35); S.res.stone = Math.max(0,S.res.stone-25);
           S.morale = clamp(S.morale-10,0,100);
           return `외곽이 뚫렸다. 인구 -${Math.round(loss)}, 목재 -35, 석재 -25.`;
         }},
        {label:"야전에서 정면으로 맞선다", chanceFn:fieldChance,
         hint:"위험이 크지만 이기면 적 전력을 크게 깎는다",
         run(ok){
           S.counters.wars++;
           if(ok){ n.mil = Math.round(n.mil*0.6); n.territory = Math.max(1, n.territory-1);
             const loot = Math.round(n.stock.metal*0.25); n.stock.metal -= loot;
             const pool = technologySystem.availableMetals();
             if(pool.length) resourceSystem.gainMetal(pool[pool.length-1].id, loot);
             S.pop -= Math.max(1, S.pop*0.03); S.morale = clamp(S.morale+16,0,100);
             if(n.mil < 10){ n.conquered = true; n.war = false; S.counters.conquer++;
               return `${n.name}의 주력이 야전에서 무너졌다. 그 나라는 복속됐다.`; }
             return `야전에서 이겼다. ${n.name}의 군세가 반토막 났고 금속 ${loot}을(를) 노획했다.`; }
           const loss = Math.max(4, S.pop*0.12);
           S.pop -= loss; S.stats.mil = Math.max(4, S.stats.mil-4); S.morale = clamp(S.morale-16,0,100);
           return `대열이 무너졌다. 인구 -${Math.round(loss)}, 군사력 -4, 사기 -16.`;
         }},
        {label:"조공을 바쳐 물린다", chanceFn:()=>1,
         hint:`목재·석재 각 ${tribute} 상당을 내준다. 전쟁이 멈출 가능성이 높다`,
         run(){
           const w = Math.min(S.res.wood, tribute), st2 = Math.min(S.res.stone, tribute);
           S.res.wood -= w; S.res.stone -= st2;
           if(w + st2 < tribute){ S.morale = clamp(S.morale-8,0,100);
             return "내줄 것이 모자랐다. 적장은 비웃으며 진군을 계속했다."; }
           n.war = false; n.attitude = clamp(n.attitude+18,-100,100); S.morale = clamp(S.morale-6,0,100);
           return `목재 ${Math.round(w)}, 석재 ${Math.round(st2)}을(를) 내주고 군을 물렸다. 백성은 이를 굴욕으로 기억한다.`;
         }},
        {label:"주민을 대피시키고 마을을 내준다", chanceFn:()=>1,
         hint:"인명 피해는 최소, 건물과 자원은 잃는다",
         run(){
           const keys = Object.keys(S.buildings).filter(k=>S.buildings[k]>0);
           let lost = "";
           if(keys.length){ const k = pick(keys); S.buildings[k]--; lost = ` ${BUILD_BY_ID[k].name} 하나가 불탔다.`; }
           S.res.wood = Math.max(0,S.res.wood*0.6); S.res.stone = Math.max(0,S.res.stone*0.6);
           S.pop -= Math.max(1, S.pop*0.015); S.morale = clamp(S.morale-12,0,100);
           n.territory++; n.attitude = clamp(n.attitude+6,-100,100);
           if(rnd() < 0.5) n.war = false;
           return `사람은 지켰고 터는 잃었다. 창고의 40%가 사라졌다.${lost}`;
         }}
      ]
    };
    // 동맹이 있다면 급보를 띄울 수 있다
    if(nationSystem.allyList(n).length) S.pending.options.push({
      label:"동맹에 급보를 띄운다",
      chanceFn:()=>clamp(0.28 + effStat("dip")/180 + nationSystem.allySupport(n)/Math.max(1, nationSystem.power(n))*0.5, 0.05, 0.92),
      hint:"성공 시 동맹군이 측면을 쳐 적을 물린다 / 실패 시 원군이 늦는다",
      run(ok){
        const allies = nationSystem.allyList(n);
        if(ok){
          n.mil = Math.round(n.mil*0.72);
          for(const a of allies){ a.attitude = clamp(a.attitude-4,-100,100); if(rnd()<0.4) a.mil = Math.round(a.mil*0.95); }
          S.morale = clamp(S.morale+12,0,100);
          if(rnd() < 0.55){ n.war = false;
            return `${allies.map(a=>a.name).join(", ")}의 깃발이 언덕 위에 나타났다. ${n.name}은(는) 협공을 피해 군을 물렸다.`; }
          return `동맹군이 측면을 쳤다. ${n.name}의 군사력이 28% 꺾였다.`;
        }
        const loss = Math.max(2, S.pop*0.05); S.pop -= loss; S.morale = clamp(S.morale-10,0,100);
        for(const a of allies) a.attitude = clamp(a.attitude-6,-100,100);
        return `원군은 사흘 늦게 도착했다. 인구 -${Math.round(loss)}, 사기 -10.`;
      }});
    // 화술이 있다면 칼을 섞기 전에 적진을 흔들 수 있다
    if(has("rhet3")) S.pending.options.push({
      label:"적진에 사절을 보내 흔든다",
      chanceFn:()=>clamp(0.10 + effStat("dip")/280 + (has("rhet4")?0.06:0) - Math.max(0, n.tier - civTier())*0.05, 0.04, 0.65),
      hint:"성공 시 적 병력 일부가 이탈해 우리 편이 된다 / 실패 시 사기 하락",
      run(ok){
        if(ok){
          const g = Math.round(n.mil*0.20); n.mil = Math.round(n.mil - g);
          S.stats.mil += Math.max(2, Math.round(g*0.45));
          S.morale = clamp(S.morale+10,0,100);
          if(rnd() < 0.5){ n.war = false;
            return `진군하던 대오가 갈라졌다. ${n.name}은(는) 군을 되돌렸고, 이탈병 일부가 우리 깃발 아래 섰다. 군사력 +${Math.max(2,Math.round(g*0.45))}.`; }
          return `적 병력 ${g}이(가) 흩어졌고 일부는 우리 편이 되었다. 군사력 +${Math.max(2,Math.round(g*0.45))}.`;
        }
        S.morale = clamp(S.morale-8,0,100);
        return "사절의 목이 성문 앞에 걸렸다. 사기 -8.";
      }});
    // 마법이 있다면 방어 선택지가 늘어난다
    if(canMagic() && has("mag2")) S.pending.options.push({
      label:"결계로 성문을 봉한다",
      chanceFn:()=>clamp(probabilitySystem.calculateSuccessChance("defend", S, n) + 0.12 + b("tower")*0.03, 0.05, 0.95),
      hint:"마탑이 많을수록 유리하다. 성공 시 피해 없이 격퇴",
      run(ok){
        if(ok){ n.mil = Math.round(n.mil*0.88); S.morale = clamp(S.morale+8,0,100);
          if(rnd()<0.5){ n.war = false; return "결계 앞에서 적이 발길을 돌렸다. 전쟁이 멈췄다."; }
          return "결계가 성문을 지켰다. 사상자 없이 적을 물렸다."; }
        S.morale = clamp(S.morale-8,0,100); S.pop -= Math.max(2, S.pop*0.04);
        return "결계가 깨졌다. 술사들이 먼저 쓰러졌다.";
      }});
    if(canMagic() && has("mag3")) S.pending.options.push({
      label:"적진 앞에 불의 벽을 세운다",
      chanceFn:()=>clamp(0.18 + effStat("mag")/240, 0.05, 0.88),
      hint:"성공 시 적 군사력 25% 소실 / 실패 시 아군 진영까지 번진다",
      run(ok){
        if(ok){ n.mil = Math.round(n.mil*0.75); S.morale = clamp(S.morale+10,0,100);
          if(rnd()<0.45){ n.war = false; return "불길을 넘지 못한 적이 퇴각했다. 전쟁이 끝났다."; }
          return `불의 벽이 진군을 끊었다. ${n.name}의 군사력이 25% 줄었다.`; }
        S.res.wood = Math.max(0, S.res.wood-40); S.pop -= Math.max(2, S.pop*0.05);
        S.morale = clamp(S.morale-12,0,100);
        return "바람이 바뀌어 불이 우리 쪽으로 왔다. 목재 -40, 인구 손실.";
      }});
    if(canMagic() && has("mag4")) S.pending.options.push({
      label:"적 병력을 공허로 밀어낸다",
      chanceFn:()=>clamp(0.14 + effStat("mag")/220, 0.05, 0.88),
      hint:"성공 시 적 주력 소멸과 전쟁 종결 / 실패 시 심각한 마력 반동",
      run(ok){
        if(ok){ n.mil = Math.round(n.mil*0.55); n.war = false; n.attitude = clamp(n.attitude-20,-100,100);
          S.morale = clamp(S.morale+14,0,100);
          if(n.mil < 10){ n.conquered = true; S.counters.conquer++;
            return `${n.name}의 군대가 통째로 사라졌다. 남은 영토는 우리에게 복속됐다.`; }
          return `적 주력의 절반이 공허로 떨어졌다. ${n.name}은(는) 군을 물렸다.`; }
        const loss = Math.max(4, S.pop*0.08); S.pop -= loss; S.morale = clamp(S.morale-18,0,100);
        S.stats.mag = Math.max(2, S.stats.mag-4);
        return `균열이 아군 쪽에서 열렸다. 인구 -${Math.round(loss)}, 사기 -18, 마법력 -4.`;
      }});
    if(M().ward > 0) M().ward--;
    log(`${n.name}의 침공이 시작됐다.`, "bad");
  },

  /* 국가끼리도 싸운다. 이기면 상대를 속국으로 두거나 통째로 삼킨다. */
  alive(){ return S.nations.filter(n => !n.absorbed && !n.conquered); },
  interNationWar(){
    const pool = nationSystem.alive().filter(n => !n.overlord);
    if(pool.length < 2) return;
    if(rnd() > 0.055 * DF().hostility) return;
    const disp = nationSystem.disp;
    // 공격자는 호전적이고 강한 쪽에서 고른다
    // 강한 나라일수록 먼저 칼을 뽑는다. 한 나라가 거듭 삼키면 패권국이 자란다.
    const atkPool = (pool.filter(n => disp(n).warBias > 0).length ? pool.filter(n => disp(n).warBias > 0) : pool)
                      .slice().sort((a,b2)=> nationSystem.power(b2) - nationSystem.power(a));
    const atk = atkPool[Math.floor(Math.pow(rnd(), 2.2) * atkPool.length)];
    if(!atk) return;
    const defPool = pool.filter(n => n !== atk && n !== undefined);
    if(!defPool.length) return;
    // 자기보다 약해 보이는 쪽을 노린다
    defPool.sort((a,b2)=> nationSystem.power(a) - nationSystem.power(b2));
    const def = defPool[Math.floor(Math.pow(rnd(), 1.8) * defPool.length)];
    if(!def || def === atk) return;

    const pA = nationSystem.power(atk) * (0.85 + rnd()*0.4);
    const pD = nationSystem.power(def) * (0.85 + rnd()*0.4) * (def.ally ? 1.15 : 1);
    const known = atk.discovered || def.discovered;
    const say = (txt, kind) => { if(known) log(txt, kind || "warn"); };

    if(pA > pD * 1.7){
      // 완전 병합
      def.absorbed = true; def.war = false; def.ally = false; def.vassal = false; def.route = false;
      atk.mil = Math.round(atk.mil + def.mil*0.45);
      atk.territory += Math.round(def.territory*0.6);
      atk.stock.wood += Math.round(def.stock.wood*0.5);
      atk.stock.stone += Math.round(def.stock.stone*0.5);
      atk.stock.metal += Math.round(def.stock.metal*0.5);
      atk.absorbedCount = (atk.absorbedCount || 0) + 1;
      atk.growCap = (atk.growCap || 3) + 1.3;    // 삼킨 만큼 더 자랄 여지가 생긴다
      say(`${atk.name}이(가) ${def.name}을(를) 병합했다. 지도에서 한 나라가 사라졌다.`, "bad");
    }else if(pA > pD * 1.2){
      // 속국화
      def.overlord = atk.id; def.war = false;
      def.attitude = clamp(def.attitude - 5, -100, 100);
      atk.mil = Math.round(atk.mil + def.mil*0.12);
      say(`${def.name}이(가) ${atk.name}에 무릎을 꿇고 속국이 되었다.`, "warn");
    }else if(pD > pA * 1.35){
      atk.mil = Math.round(atk.mil * 0.78);
      atk.attitude = clamp(atk.attitude - 3, -100, 100);
      say(`${atk.name}이(가) ${def.name} 국경에서 크게 꺾였다.`, "warn");
    }else{
      atk.mil = Math.round(atk.mil * 0.9);
      def.mil = Math.round(def.mil * 0.88);
      say(`${atk.name}과 ${def.name}이(가) 국경에서 오래 맞붙었다. 양쪽 다 지쳤다.`, "warn");
    }
    // 우리와의 관계 정리
    for(const n of [atk, def]){
      if(n.absorbed){
        if(n.ally) log(`동맹국 ${n.name}이(가) 지도에서 사라졌다.`, "bad");
        n.ally = false; n.war = false; n.vassal = false;
      }
    }
  },
  /* 속국은 종주국을 살찌운다 */
  overlordTribute(){
    for(const n of S.nations){
      if(!n.overlord || n.absorbed) continue;
      const lord = S.nations.find(x => x.id === n.overlord && !x.absorbed);
      if(!lord || lord.conquered){ n.overlord = null; continue; }
      lord.mil *= 1.0015; lord.eco *= 1.002;
      if(rnd() < 0.004){ n.overlord = null;
        if(n.discovered) log(`${n.name}이(가) 종주국의 손아귀에서 벗어났다.`, "warn"); }
    }
  },

  /* 정찰로 발견 가능한 후보 선정 */
  discoverCandidate(){
    const pt = civTier();
    const pool = S.nations.filter(n => !n.discovered && !n.absorbed);
    if(!pool.length) return null;
    const allowed = pool.filter(n => {
      if(pt < 3 && n.tier >= 4) return false;   // 실버 이전엔 골드 이상 금지
      return true;
    });
    const use = allowed.length ? allowed : pool.filter(n=>n.tier<=Math.max(3,pt+1));
    if(!use.length) return null;
    // 등급 근접도 가중
    const weights = use.map(n => {
      const d = Math.abs(n.tier - pt);
      const early = S.turn < 30 ? 2.4 : (S.turn < 70 ? 1.4 : 0.9);
      return Math.max(0.12, 1 / Math.pow(1 + d, early));
    });
    let sum = weights.reduce((a,b2)=>a+b2,0), r = rnd()*sum;
    for(let i=0;i<use.length;i++){ r -= weights[i]; if(r<=0) return use[i]; }
    return use[use.length-1];
  },
  /* 국가들이 스스로 움직인다 */
  worldTurn(){
    for(const n of S.nations){ if(!n.absorbed) nationSystem.grow(n); }   // 미발견국도 함께 자란다
    nationSystem.interNationWar();
    nationSystem.overlordTribute();
    // 거래 피로 회복 — 시간이 지나면 상대도 다시 값을 쳐준다
    if(S.turn % 8 === 0) for(const n of S.nations) if(n.tradeCount > 0) n.tradeCount--;
    // 상설 교역로 수입
    for(const n of S.nations){
      if(!n.route || n.conquered || n.absorbed || n.war) continue;
      const g = (2 + n.eco*0.05) * (1 + S.mods.trade) * DF().res;
      S.res.wood += g; S.res.stone += g*0.7;
      if(rnd() < 0.2){
        const pool = technologySystem.availableMetals();
        if(pool.length) resourceSystem.gainMetal(pool[Math.floor(rnd()*pool.length)].id, Math.round(g*0.4));
      }
    }
    // 속국의 조공
    for(const n of S.nations){
      if(!n.vassal || n.conquered || n.absorbed || n.war) continue;
      const t = 1 + n.eco*0.06;
      S.res.wood += t; S.res.stone += t*0.8;
      if(rnd() < 0.25){
        const pool = technologySystem.availableMetals();
        if(pool.length) resourceSystem.gainMetal(pool[Math.floor(rnd()*pool.length)].id, Math.round(t*0.5));
      }
      n.attitude = clamp(n.attitude - 0.4, -100, 100);
      if(n.attitude < -70 && rnd() < 0.03 * (1 + (S.flags.overextend||0)*0.5)){
        n.vassal = false; n.war = true;
        log(`${n.name}이(가) 조공을 거부하고 반란을 일으켰다.`, "bad");
      }
    }
    for(const n of S.nations){
      if(!n.discovered || n.conquered || n.absorbed) continue;
      const d = nationSystem.disp(n);
      // 성향에 따른 태도 표류
      n.attitude = clamp(n.attitude + (d.trustBias>0 ? 0.4 : -0.35) + (rnd()-0.5), -100, 100);
      if(n.ally) n.attitude = clamp(n.attitude + 0.5, -100, 100);
      if(S.turn - n.lastAction < 6) continue;
      if(rnd() > 0.10 * nationSystem.pressure() * 1.4) continue;
      n.lastAction = S.turn;
      const roll = rnd()*100 + d.warBias;
      if(roll > 88 && !n.ally && n.attitude < 0 && !n.war){
        n.war = true;
        log(`${n.name}이(가) 국경을 넘어 전쟁을 선포했다.`, "bad");
      }else if(roll > 70 && n.attitude < -20){
        const dem = Math.round(15 + rnd()*25);
        S.pending = {
          title: `${n.name}의 조공 요구`,
          text: `${n.name}의 사절이 목재 ${dem}과 석재 ${dem}을 요구한다. 거절하면 관계가 크게 나빠진다.`,
          options: [
            {label:"요구를 들어준다", chance:1, hint:"자원을 잃지만 관계가 회복된다",
             run(){ S.res.wood=Math.max(0,S.res.wood-dem); S.res.stone=Math.max(0,S.res.stone-dem);
               n.attitude=clamp(n.attitude+24,-100,100); return "사절은 만족해 돌아갔다. 관계 +24."; }},
            {label:"거절한다", chance:1, hint:"관계 악화, 전쟁 가능성",
             run(){ n.attitude=clamp(n.attitude-22,-100,100);
               if(rnd()<0.3){ n.war=true; return "사절이 칼자루를 쥐고 돌아섰다. 전쟁이 선포됐다."; }
               return "요구를 물렸다. 관계 -22."; }},
            {label:"사절을 붙잡아 심문한다", chance:0.45, hint:"성공 시 정보 획득, 실패 시 관계 파탄",
             run(){ if(rnd()<0.45){ n.intel=Math.min(3,n.intel+2); n.attitude=clamp(n.attitude-12,-100,100);
                 return `심문에 성공했다. ${n.name}의 정보를 크게 얻었다.`; }
               n.attitude=clamp(n.attitude-40,-100,100); n.war = rnd()<0.5;
               return "사절은 아무 말도 하지 않았고, 소문만 퍼졌다."; }}
          ]
        };
      }else if(roll > 45 && n.attitude > 10 && d.tradeBias > 0){
        const give = Math.round(20+rnd()*30);
        const get = Math.round((18+rnd()*34) * (1 + civTier()*0.12));
        S.pending = {
          title: `${n.name}의 교역 제안`,
          text: `${n.name}이(가) 석재 ${give}을 받고 목재 ${get}을 주겠다고 한다.`,
          options: [
            {label:"제안을 받는다", chance:1, hint:"자원 교환, 관계 개선",
             run(){ if(S.res.stone < give) return "창고에 내줄 석재가 없었다. 거래는 무산됐다.";
               S.res.stone-=give; S.res.wood+=get; n.attitude=clamp(n.attitude+12,-100,100);
               S.counters.trades++; return `거래 성사. 목재 +${get}, 석재 -${give}, 관계 +12.`; }},
            {label:"조건을 더 요구한다", chance:0.5, hint:"성공 시 이익 증가, 실패 시 결렬",
             run(){ const c = probabilitySystem.calculateSuccessChance("haggle", S, n);
               if(rnd()<c){ S.res.wood += Math.round(get*1.5); if(S.res.stone>=give) S.res.stone-=give;
                 S.counters.trades++; n.attitude=clamp(n.attitude+4,-100,100);
                 return `협상 성공. 목재 +${Math.round(get*1.5)}.`; }
               n.attitude=clamp(n.attitude-10,-100,100); return "상인이 짐을 도로 쌌다. 관계 -10."; }},
            {label:"거절한다", chance:1, hint:"관계 소폭 하락",
             run(){ n.attitude=clamp(n.attitude-5,-100,100); return "제안을 물렸다."; }}
          ]
        };
      }
    }
    // 전쟁 중인 국가의 습격과 전면 침략
    for(const n of S.nations){
      if(!n.war || n.conquered || n.absorbed) continue;
      if(!S.pending && rnd() < 0.12 * DF().hostility * nationSystem.pressure()){ nationSystem.invasion(n); continue; }
      if(rnd() < 0.16 * nationSystem.pressure()) battleSystem.raid(n);
    }
    // 동맹이 전쟁에 휘말리면 우리에게 파병을 청한다
    if(!S.pending){
      const beg = S.nations.find(x => x.ally && x.war && !x.conquered && S.turn - (x.lastBeg || -20) > 18);
      if(beg && rnd() < 0.10){
        beg.lastBeg = S.turn;
        const enemy = S.nations.find(x => x !== beg && x.war && !x.conquered) || null;
        S.pending = {
          title: `${beg.name}의 파병 요청`,
          text: `동맹국 ${beg.name}이(가) 전쟁에 몰려 원군을 청한다.${enemy ? ` 상대는 ${enemy.name}이다.` : ""} 보낼 것인가.`,
          options: [
            {label:"원군을 보낸다", chanceFn:()=>clamp(0.35 + effStat("mil")/200, 0.05, 0.92),
             hint:"성공 시 동맹 관계 급상승 / 실패 시 병력 손실",
             run(ok){ S.pop -= Math.max(1, S.pop*0.02);
               if(ok){ beg.attitude = clamp(beg.attitude+30,-100,100); beg.war = false;
                 S.morale = clamp(S.morale+8,0,100);
                 return `원군이 전세를 뒤집었다. ${beg.name}과의 관계 +30, 그들의 전쟁이 끝났다.`; }
               S.stats.mil = Math.max(4, S.stats.mil-3); beg.attitude = clamp(beg.attitude+8,-100,100);
               return "원군은 제 몫을 못 했다. 군사력 -3."; }},
            {label:"물자만 지원한다", chanceFn:()=>1, hint:"자원을 내주고 관계를 지킨다",
             run(){ const g = Math.round(20 + S.res.wood*0.1);
               if(S.res.wood < g) { beg.attitude = clamp(beg.attitude-10,-100,100); return "보낼 물자조차 없었다. 관계 -10."; }
               S.res.wood -= g; beg.attitude = clamp(beg.attitude+14,-100,100);
               return `목재 ${g}을(를) 보냈다. 관계 +14.`; }},
            {label:"거절한다", chanceFn:()=>1, hint:"동맹이 깨질 수 있다",
             run(){ beg.attitude = clamp(beg.attitude-30,-100,100);
               if(rnd() < 0.6){ beg.ally = false; return `${beg.name}이(가) 동맹을 파기했다.`; }
               return `${beg.name}은(는) 실망했지만 동맹은 유지된다. 관계 -30.`; }}
          ]
        };
      }
    }
    // 적대 연합 — 정복·배신·급성장은 주변국을 뭉치게 만든다
    if(!S.pending && S.turn - (S.flags.lastCoalition || -40) > 35){
      const notoriety = S.counters.conquer*1.5 + S.counters.betrays + Math.max(0, civTier()-4)*0.8;
      const pool = S.nations.filter(n => n.discovered && !n.conquered && !n.absorbed && !n.vassal && n.attitude < 15);
      if(notoriety >= 2 && pool.length >= 2 && rnd() < 0.03 * DF().hostility * notoriety){
        S.flags.lastCoalition = S.turn;
        const members = pool.sort((a,b2)=>nationSystem.power(b2)-nationSystem.power(a)).slice(0, Math.min(3, pool.length));
        const leader = members[0];
        let boost = 0;
        for(const m of members){ m.war = true; m.attitude = clamp(m.attitude-25,-100,100); if(m !== leader) boost += m.mil*0.5; }
        leader.mil = Math.round(leader.mil + boost);
        leader.lastInvasion = -99;
        log(`${members.map(m=>m.name).join(", ")}이(가) 우리를 겨냥한 연합을 결성했다.`, "bad");
        nationSystem.invasion(leader);
      }
    }
    // 지도 밖의 강국이 먼저 우리를 찾아낼 수도 있다
    if(!S.pending && S.turn > 40 && rnd() < 0.012 * DF().hostility){
      const cands = S.nations.filter(x => !x.discovered && !x.conquered && !x.absorbed && nationSystem.disp(x).warBias > 0);
      if(cands.length){
        const n = pick(cands);
        if(nationSystem.power(n) > battleSystem.playerPower()*0.6){
          n.discovered = true; n.intel = 1; n.war = true;
          n.attitude = clamp(n.attitude - 30, -100, 100);
          log(`이름조차 몰랐던 ${n.name}의 깃발이 지평선에 나타났다.`, "bad");
          nationSystem.invasion(n);
        }
      }
    }
    // 전쟁 상태가 아니어도, 적대적이고 강한 이웃은 먼저 쳐들어온다
    if(!S.pending){
      for(const n of S.nations){
        if(n.conquered || n.war || n.absorbed || !n.discovered) continue;
        const d = nationSystem.disp(n);
        const gap = nationSystem.power(n) / Math.max(1, battleSystem.playerPower());
        const hostile = n.attitude < -35 || (d.warBias > 20 && n.attitude < 0);
        if(hostile && gap > 1.2 && rnd() < (0.02 + Math.min(0.05, (gap-1)*0.02)) * nationSystem.pressure()){
          n.war = true;
          log(`${n.name}의 군대가 예고 없이 국경을 넘었다.`, "bad");
          nationSystem.invasion(n);
          break;
        }
      }
    }
  }
};

/* ---------------------- probabilitySystem ---------------------- */
const probabilitySystem = {
  calculateSuccessChance(action, st, target){
    const A = speciesSystem.activity();
    const T = S.terrain;
    let c = 0.5;
    switch(action){
      case "wood":   c = 0.60 + effStat("prod")/260 + (has("build1")?0.05:0) + (T.wood-1)*0.2; break;
      case "stone":  c = 0.56 + effStat("prod")/270 + (has("build2")?0.06:0) + (T.stone-1)*0.2; break;
      case "metal":  c = 0.42 + effStat("mine")/210 + b("mine")*0.03 + (T.metal-1)*0.2 + (has("mine2")?0.05:0); break;
      case "food":   c = 0.58 + effStat("agri")/200 + b("farm")*0.02 + (T.food-1)*0.2; break;
      case "vital":  c = 0.62 + effStat("prod")/300 + b("farm")*0.015; break;
      case "sun":    c = S.phase==="낮" ? 0.90 + b("garden")*0.02 : 0.30 + (has("sun1")?0.25:0); break;
      case "scout":  c = 0.40 + effStat("scout")/170 + S.mods.scout*0.5 + T.scout + (M().scoutBoost>0?0.25:0); break;
      case "train":  c = 0.70 + effStat("mil")/320 + mt("train"); break;
      case "festival": c = 0.78 + effStat("dip")/400; break;
      case "research": {
        const t = target;
        const brain = (t.f==="마법"||t.f==="히든") ? (effStat("mag")*0.8 + effStat("sci")*0.5) : (effStat("sci")*0.9 + effStat("mag")*0.2);
        const need = Math.max(10, (t.cost.sci||20) * 0.72);
        c = (0.17 + Math.min(0.38, brain/need * 0.36) + S.mods.research + b("lab")*0.04
             + (S.flags.researchBoost ? 0.25 : 0)) * DF().research;
        // 기반이 없는 초반에 고등급 기술을 건드리면 확률이 급격히 무너진다
        const gap = t.t - civTier();
        if(gap > 0) c *= Math.pow(0.42, gap);
        if(t.t >= 2){                                         // 기초 기술은 그대로, 고난도만 기반을 요구한다
          const foundation = t.t * 3;                         // 등급에 걸맞은 누적 기술 수
          if(S.techs.length < foundation) c *= 0.5 + 0.5 * (S.techs.length / foundation);
        }
        if(t.t >= 4 && b("lab") === 0) c *= 0.6;              // 연구소 없이 고급 연구는 어렵다
        c += mt("research") + popTier().research;
        return clamp(c * (0.82 + 0.18*A), 0.02, 0.95);
      }
      case "build": {
        const bd = target;
        c = 0.62 + effStat("prod")/200 + S.mods.build + mt("build") + (S.species==="dwarf"?0.08:0) + (S.species==="automata"?0.15:0);
        break;
      }
      case "contact": c = 0.50 + effStat("dip")/150 + (target.attitude/300) + mt("dip"); break;
      case "trade":   c = 0.44 + effStat("dip")/170 + (target.attitude/220) + S.mods.trade*0.5 + b("market")*0.06
                          + (nationSystem.disp(target).tradeBias/300) + mt("dip"); break;
      case "haggle":  c = 0.36 + effStat("dip")/200 + (target.attitude/300); break;
      case "ally":    c = 0.16 + effStat("dip")/190 + (target.attitude/140) + S.mods.trust*0.5
                          - Math.max(0, (target.tier - civTier()))*0.05 + mt("dip"); break;
      case "betray":  c = 0.42 + effStat("dip")/260 + effStat("scout")/300 + S.mods.spy
                          + (target.ally?0.15:0) - (target.tier-civTier())*0.03; break;
      case "surrender": {
        const ratio = battleSystem.playerPower() / Math.max(1, nationSystem.power(target));
        const hurt = target.basePower ? 1 - nationSystem.curPower(target)/(target.basePower*(target.growCap||3)) : 0;
        c = 0.02 + (ratio - 1) * 0.18 + effStat("dip")/600 + (target.war ? 0.08 : 0)
            + (target.vassal ? 0.15 : 0) + Math.max(0, hurt) * 0.12
            + (target.defBroken > 0 ? 0.06 : 0) - Math.max(0, target.tier - civTier())*0.06
            - (target.demands || 0) * 0.09;      // 같은 요구를 되풀이할수록 상대는 더 버틴다
        return clamp(c, 0.02, 0.75);
      }
      case "charm": {
        c = 0.06 + effStat("dip")/340 + (has("rhet3") ? 0.05 : 0) + (has("rhet4") ? 0.05 : 0)
            + (target.war ? 0.04 : 0) + S.mods.spy*0.4 - Math.max(0, target.tier - civTier())*0.05
            - (target.demands||0)*0.05;
        return clamp(c, 0.02, 0.60);
      }
      case "mesmerize": {
        c = 0.04 + effStat("dip")/300 + effStat("mag")/700 + (target.war ? 0.05 : 0)
            - Math.max(0, target.tier - civTier())*0.06 - (target.demands||0)*0.05;
        return clamp(c, 0.02, 0.50);
      }
      case "tribute": {
        const ratio = battleSystem.playerPower() / Math.max(1, nationSystem.power(target));
        c = 0.10 + (ratio - 1) * 0.20 + effStat("dip")/380 + (target.vassal ? 0.22 : 0)
            + (target.attitude < -40 ? -0.08 : 0) - (target.demands || 0) * 0.06;
        return clamp(c, 0.03, 0.92);
      }
      case "truce": {
        const ratio = battleSystem.playerPower() / Math.max(1, nationSystem.power(target));
        c = 0.22 + effStat("dip")/200 + clamp(ratio-1, -0.25, 0.3) + (target.attitude+100)/500
            + (nationSystem.disp(target).warBias < 0 ? 0.12 : 0);
        break;
      }
      case "spy":     c = 0.38 + effStat("scout")/150 + S.mods.spy + (has("scout2")?0.08:0)
                          - target.tier*0.02; break;
      case "war": {
        const p = battleSystem.playerPower() + nationSystem.allySupport(target)*0.8, e = battleSystem.enemyPower(target);
        c = p / (p + e);
        c += b("wall")*0.01 + S.mods.siege*0.5;
        c += (target.defBroken > 0 ? 0.12 : 0) + (M().fire > 0 ? 0.12 : 0) + mt("war") + (M().armory > 0 ? 0.15 : 0)
             + (M().bomb > 0 ? 0.18 : 0);
        return clamp(c, 0.05, 0.93);
      }
      case "riftraid": {
        const p = battleSystem.playerPower("magic") + nationSystem.allySupport(target)*0.6, e = battleSystem.enemyPower(target);
        c = p / (p + e) + (target.defBroken > 0 ? 0.1 : 0) + (M().fire > 0 ? 0.1 : 0);
        return clamp(c, 0.05, 0.93);
      }
      case "defend": {
        const p = battleSystem.playerPower()*(1 + b("wall")*0.08) + nationSystem.allySupport(target), e = battleSystem.enemyPower(target)*0.85;
        return clamp(p/(p+e) + (M().ward > 0 ? 0.15 : 0) + mt("defend") + (S.mods.defend||0) + (M().armory > 0 ? 0.15 : 0), 0.08, 0.95);
      }
      /* --- 마법 행동 --- */
      case "m_rain":      c = 0.30 + effStat("mag")/300 + mt("magic"); break;
      case "m_read":      c = 0.34 + effStat("mag")/320 + mt("magic"); break;
      case "m_rune":      c = 0.26 + effStat("mag")/280 + b("tower")*0.03 + mt("magic"); break;
      case "m_ward":      c = 0.30 + effStat("mag")/300 + b("wall")*0.02 + mt("magic"); break;
      case "m_vein":      c = 0.22 + effStat("mag")/260 + effStat("mine")/300 + mt("magic"); break;
      case "m_fire":      c = 0.26 + effStat("mag")/270 + mt("magic"); break;
      case "m_foresee":   c = 0.18 + effStat("mag")/240 + mt("magic"); break;
      case "m_rift":      c = 0.20 + effStat("mag")/260 + mt("magic"); break;
      case "m_dragon":    c = 0.18 + effStat("mag")/230 + mt("magic"); break;
      case "m_siege":     c = 0.22 + effStat("mag")/260 - target.tier*0.02 + mt("magic"); break;
      case "m_barrage":   c = 0.18 + effStat("mag")/250 - target.tier*0.025 + mt("magic"); break;
      default: c = 0.5;
    }
    c *= (0.82 + 0.18*A);
    return clamp(c, 0.05, 0.95);
  },
  /* 실제 판정: 표시 확률 그대로 사용 */
  roll(chance){
    let r = rnd();
    // 예지를 봐 둔 상태라면 나쁜 결과를 한 번 되돌린다
    if(r >= chance && M().foresight > 0){
      M().foresight--;
      const r2 = rnd();
      log("예지가 발동했다. 주사위를 한 번 더 굴린다.", "mag");
      r = r2;                                 // 두 번째 주사위를 채택한다
    }
    if(r < chance*0.18) return {tier:"대성공", r};
    if(r < chance) return {tier:"성공", r};
    if(r < chance + (1-chance)*0.45) return {tier:"부분 성공", r};
    if(r > 0.985) return {tier:"돌발", r};
    return {tier:"실패", r};
  }
};

/* ---------------------- battleSystem ---------------------- */
const battleSystem = {
  metalBonus(){
    const m = resourceSystem.bestMetal();
    if(!m) return {mul:1, name:"맨손"};
    return {mul: 1 + (m.atk + m.def)/45, name: m.name};
  },
  playerPower(mode){
    const common = (0.7 + S.morale/160) * (1 + Math.min(2.0, S.pop/450)) * (1 + popTier().mil);
    if(mode === "magic"){
      const affinity = 1 + ((S.metals.silver||0) > 10 ? 0.12 : 0) + ((S.metals.mithril||0) > 10 ? 0.18 : 0);
      return effStat("mag") * 1.05 * affinity * (1 + b("tower")*0.09) * common;
    }
    const mb = battleSystem.metalBonus();
    return effStat("mil") * mb.mul * (1 + b("barrack")*0.06) * common;
  },
  /* 정복·배신·급성장이 쌓일수록 상대는 총력으로 맞선다 */
  notoriety(){ return S.counters.conquer*1.5 + S.counters.betrays + Math.max(0, civTier()-4)*0.8; },
  enemyPower(n){
    return nationSystem.power(n) * 0.9 * (1 + Math.min(0.55, battleSystem.notoriety()*0.045));
  },
  war(n, mode){
    const magic = mode === "magic";
    const c = probabilitySystem.calculateSuccessChance(magic ? "riftraid" : "war", S, n);
    const res = probabilitySystem.roll(c);
    S.counters.wars++;
    n.war = true; n.ally = false; n.treaty = false;
    if(M().fire > 0) M().fire--;
    if(M().armory > 0) M().armory--;
    if(M().bomb > 0) M().bomb--;
    if(n.defBroken > 0) n.defBroken--;
    if(res.tier==="대성공" || res.tier==="성공") n.demands = Math.max(0, (n.demands||0) - 2);   // 전장에서 이기면 사절의 말이 다시 무거워진다
    let msg = "";
    const lossBase = Math.max(2, S.pop*0.05);
    if(res.tier === "대성공"){
      const loot = {wood: Math.round(n.stock.wood*0.4), stone: Math.round(n.stock.stone*0.35), metal: Math.round(n.stock.metal*0.4)};
      S.res.wood += loot.wood; S.res.stone += loot.stone;
      const pool = technologySystem.availableMetals();
      if(pool.length) resourceSystem.gainMetal(pool[pool.length-1].id, loot.metal);
      n.stock.wood -= loot.wood; n.stock.stone -= loot.stone; n.stock.metal -= loot.metal;
      n.mil = Math.round(n.mil*0.45); n.territory = Math.max(1, n.territory-3);
      S.pop -= lossBase*0.3; S.morale = clamp(S.morale+12,0,100);
      if(n.mil < battleSystem.playerPower()*0.25 || n.territory <= 2){ n.conquered = true; n.war=false; n.vassal=false; S.counters.conquer++;
        msg = `${n.name}의 수도가 함락됐다. ${n.name}은(는) 복속됐다.`; }
      else msg = `압승했다. 전리품: 목재 ${loot.wood}, 석재 ${loot.stone}, 금속 ${loot.metal}.`;
      if(S.species==="dragonkin"){ resourceSystem.gainMetal("gold", 8); msg += " 금화 더미도 챙겼다."; }
      log(msg, "good");
    }else if(res.tier === "성공"){
      const loot = {wood: Math.round(n.stock.wood*0.2), stone: Math.round(n.stock.stone*0.18)};
      S.res.wood += loot.wood; S.res.stone += loot.stone;
      n.stock.wood -= loot.wood; n.mil = Math.round(n.mil*0.68);
      if(rnd() < 0.4) n.territory = Math.max(1, n.territory-1);
      S.pop -= lossBase*0.7; S.stats.mil = Math.max(4, S.stats.mil-1);
      S.morale = clamp(S.morale+6,0,100);
      msg = `전투에서 이겼다. 목재 ${loot.wood}, 석재 ${loot.stone}을 노획했다. 병력 손실 ${Math.round(lossBase*0.7)}.`;
      log(msg, "good");
    }else if(res.tier === "부분 성공"){
      S.pop -= lossBase; n.mil = Math.round(n.mil*0.92);
      S.morale = clamp(S.morale-4,0,100);
      msg = `국경에서 치고받다 물러났다. 양쪽 다 손해만 봤다. 인구 -${Math.round(lossBase)}.`;
      log(msg, "warn");
    }else if(res.tier === "돌발"){
      n.attitude = clamp(n.attitude+30,-100,100); n.war=false;
      msg = `전장에서 예상치 못한 일이 벌어졌다. ${n.name}의 지휘관이 회담을 제안했고 전쟁이 즉시 멈췄다.`;
      log(msg, "mag");
    }else{
      S.pop -= lossBase*1.3; S.stats.mil = Math.max(4, S.stats.mil-3);
      S.res.wood = Math.max(0, S.res.wood - 25); S.morale = clamp(S.morale-12,0,100);
      msg = `패했다. 인구 -${Math.round(lossBase*1.3)}, 군사력 -3, 사기 -12. 아직 문명은 남아 있다.`;
      log(msg, "bad");
    }
    n.attitude = clamp(n.attitude - 30, -100, 100);
    // 함께 싸운 동맹은 피를 흘리고, 전쟁이 길어질수록 지친다
    const helpers = nationSystem.allyList(n);
    if(helpers.length){
      for(const h of helpers){
        h.attitude = clamp(h.attitude - 3, -100, 100);
        if(rnd() < 0.25) h.mil = Math.round(h.mil * 0.96);
        if(h.attitude < 10 && rnd() < 0.15){ h.ally = false;
          log(`${h.name}이(가) 계속되는 참전에 지쳐 동맹에서 물러났다.`, "warn"); }
      }
      msg += ` ${helpers.map(h=>h.name).join(", ")}의 지원군이 함께 싸웠다.`;
    }
    return {msg, chance:c, res};
  },
  raid(n){
    if(!n || n.absorbed || n.conquered) return;
    const c = probabilitySystem.calculateSuccessChance("defend", S, n);
    const res = probabilitySystem.roll(c);
    if(res.tier === "대성공" || res.tier === "성공"){
      n.mil = Math.round(n.mil*0.9);
      log(`${n.name}의 습격을 막아냈다. 성벽이 값을 했다.`, "good");
    }else if(res.tier === "부분 성공"){
      S.res.wood = Math.max(0,S.res.wood-12); S.pop -= Math.max(1,S.pop*0.01);
      log(`${n.name}의 습격으로 외곽이 불탔다. 목재 -12.`, "warn");
    }else{
      S.res.wood = Math.max(0,S.res.wood-28); S.res.stone = Math.max(0,S.res.stone-18);
      S.pop -= Math.max(2,S.pop*0.035); S.morale = clamp(S.morale-6,0,100);
      log(`${n.name}의 습격에 마을이 뚫렸다. 자원과 인구를 잃었다.`, "bad");
    }
  }
};

/* ---------------------- explorationSystem ---------------------- */
const explorationSystem = {
  scout(){
    const c = probabilitySystem.calculateSuccessChance("scout", S);
    const res = probabilitySystem.roll(c);
    S.counters.scouts++;
    let msg;
    if(res.tier === "대성공" || res.tier === "성공"){
      const n = nationSystem.discoverCandidate();
      const findRuin = rnd() < (res.tier==="대성공" ? 0.45 : 0.22);
      if(findRuin || !n){
        return explorationSystem.discovery(res.tier==="대성공");
      }
      n.discovered = true; n.intel = res.tier==="대성공" ? 2 : 1;
      msg = `정찰대가 ${n.name}을(를) 발견했다. 문명 등급 ${TIERS[n.tier]}으로 보인다.`;
      log(msg, "good");
      return {msg, chance:c, res};
    }
    if(res.tier === "부분 성공"){
      const g = Math.round((3 + rnd()*7) * DF().res);
      S.res.wood += g;
      msg = `새 국가는 찾지 못했지만 자원지를 표시해 두었다. 목재 +${g}.`;
      log(msg, "warn");
      return {msg, chance:c, res};
    }
    if(res.tier === "돌발"){ return explorationSystem.discovery(true); }
    // 실패
    const lost = Math.max(1, Math.round(S.pop*0.012));
    S.pop -= lost;
    msg = `정찰대가 길을 잃고 일부가 돌아오지 못했다. 인구 -${lost}.`;
    log(msg, "bad");
    return {msg, chance:c, res};
  },
  discovery(great){
    const pool = [
      ()=>{ S.counters.ruins++; technologySystem.refreshVisible();
            return "무너진 석조 유적을 찾아냈다. 벽면의 문자가 아직 남아 있다."; },
      ()=>{ const pm = technologySystem.availableMetals();
            if(!pm.length) { const g=Math.round(16*DF().res); S.res.stone += g; return `광맥을 찾았지만 제련할 기술이 없어 석재만 캐왔다. 석재 +${g}.`; }
            const m = pm[pm.length-1]; const amt = Math.round((5+rnd()*9)*DF().res);
            resourceSystem.gainMetal(m.id, amt); return `${m.name} 광맥을 발견했다. ${m.name} +${amt}.`; },
      ()=>{ const amt = Math.round((9+rnd()*15)*DF().res); S.res.wood += amt; S.res.stone += Math.round(amt*0.5);
            return `버려진 야영지에서 물자를 회수했다. 목재 +${amt}, 석재 +${Math.round(amt*0.5)}.`; },
      ()=>{ S.stats.scout += 1; return "정찰대가 새 지도 기법을 익혀 왔다. 정찰력 +1."; },
      ()=>{ if(!S.flags.abyss && civTier()>=4){ S.flags.abyss = true; technologySystem.refreshVisible();
              return "해안 절벽 아래에서 빛이 새어 나오는 균열을 발견했다."; }
            const g = Math.round((7+rnd()*10)*DF().res); S.res.food += g; return `사냥감이 몰린 계곡을 찾았다. 식량 +${g}.`; },
      ()=>{ const n = S.nations.find(x=>x.discovered && !x.conquered);
            if(n){ n.intel = Math.min(3, n.intel+1); return `${n.name} 국경 마을에서 정보를 얻었다. 첩보 수준 상승.`; }
            const g = Math.round(12*DF().res); S.res.stone += g; return `낡은 채석장을 찾았다. 석재 +${g}.`; }
    ];
    let msg = pool[Math.floor(rnd()*pool.length)]();
    if(great && rnd() < 0.5){
      const extra = pool[Math.floor(rnd()*pool.length)]();
      msg += " 게다가 " + extra;
    }
    log("정찰: " + msg, "mag");
    return {msg, chance:1, res:{tier:"성공"}};
  },
  spy(n){
    const c = probabilitySystem.calculateSuccessChance("spy", S, n);
    const res = probabilitySystem.roll(c);
    if(res.tier==="대성공"){ n.intel = 3; log(`${n.name}의 내부 문서를 통째로 빼냈다.`, "good");
      return {msg:`첩보 대성공. ${n.name}의 모든 정보가 드러났다.`, chance:c, res}; }
    if(res.tier==="성공"){ n.intel = Math.min(3, n.intel+1); log(`${n.name} 첩보 성공.`, "good");
      return {msg:`첩보 성공. ${n.name}의 정보 수준이 올랐다.`, chance:c, res}; }
    if(res.tier==="부분 성공"){ return {msg:"첩자는 돌아왔지만 쓸 만한 것은 없었다.", chance:c, res}; }
    if(res.tier==="돌발"){ n.attitude = clamp(n.attitude+15,-100,100);
      return {msg:`첩자가 발각됐으나, 오히려 ${n.name} 내부 반대파와 선이 닿았다. 관계 +15.`, chance:c, res}; }
    n.attitude = clamp(n.attitude-20,-100,100);
    log(`${n.name}에서 첩자가 붙잡혔다. 관계 악화.`, "bad");
    return {msg:`첩자가 붙잡혔다. ${n.name}과의 관계 -20.`, chance:c, res};
  }
};

/* ---------------------- diplomacySystem ---------------------- */
const diplomacySystem = {
  contact(n){
    const c = probabilitySystem.calculateSuccessChance("contact", S, n);
    const res = probabilitySystem.roll(c);
    if(res.tier==="대성공"){ n.attitude=clamp(n.attitude+26,-100,100); n.intel=Math.min(3,n.intel+1);
      return {msg:`${n.name}의 왕이 직접 사절을 맞았다. 관계 +26, 정보도 얻었다.`, chance:c, res}; }
    if(res.tier==="성공"){ n.attitude=clamp(n.attitude+14,-100,100);
      return {msg:`교류에 성공했다. ${n.name}과의 관계 +14.`, chance:c, res}; }
    if(res.tier==="부분 성공"){ n.attitude=clamp(n.attitude+4,-100,100);
      return {msg:"사절은 문 앞에서 돌아섰지만 적의는 없었다. 관계 +4.", chance:c, res}; }
    if(res.tier==="돌발"){ n.attitude=clamp(n.attitude-30,-100,100);
      return {msg:`사절이 결례를 범했다. ${n.name}은(는) 이를 모욕으로 받아들였다. 관계 -30.`, chance:c, res}; }
    n.attitude=clamp(n.attitude-8,-100,100);
    return {msg:"문전박대당했다. 관계 -8.", chance:c, res};
  },
  RES_NAME: {wood:"목재", stone:"석재", food:"식량", metal:"금속"},
  resAmount(key){ return key === "metal" ? resourceSystem.metalValue() : (S.res[key] || 0); },
  payRes(key, amt){
    if(key === "metal") return resourceSystem.spendMetal(amt);
    S.res[key] = Math.max(0, (S.res[key]||0) - amt); return true;
  },
  gainRes(key, amt, prefRare, tierHint){
    if(key === "metal"){
      const pool = technologySystem.availableMetals();
      if(!pool.length){ S.res.stone += amt; return; }
      const ref = (tierHint === undefined) ? civTier() : tierHint;
      const bias = Math.max(0.35, 1.6 - ref*0.16);
      const idx = prefRare ? pool.length-1 : Math.floor(Math.pow(rnd(), bias) * pool.length);
      resourceSystem.gainMetal(pool[clamp(idx, 0, pool.length-1)].id, amt);
      return;
    }
    S.res[key] = (S.res[key]||0) + amt;
  },
  /* 상대 창고의 해당 품목 보유량 (식량은 목재 비축으로 환산) */
  stockOf(n, key){ return key === "food" ? (n.stock.wood||0)*0.6 : (n.stock[key]||0); },
  /* 이번 턴 상대가 내건 조건. 턴마다 한 번만 생성해 두고 재사용한다. */
  getOffer(n){
    if(n.offer && n.offer.turn === S.turn) return n.offer;
    const vol = 12 + n.eco*0.32;
    const stocks = [["wood", S.res.wood], ["stone", S.res.stone]];
    if(sp().food > 0) stocks.push(["food", S.res.food]);
    if(resourceSystem.metalTotal() > 40) stocks.push(["metal", resourceSystem.metalTotal()*0.8]);
    stocks.sort((a,b)=> b[1]-a[1]);
    const giveKey = stocks[0][0];
    const giveAmt = Math.max(6, Math.round(Math.min(vol, stocks[0][1]*0.35)));
    const wantPool = ["wood","stone"].concat(sp().food > 0 ? ["food"] : []).filter(k => k !== giveKey);
    wantPool.sort((a,b)=> (S.res[a]||0) - (S.res[b]||0));
    const getKey = wantPool[0];
    let ratio = 1 + S.mods.trade*0.7 + b("market")*0.15 + b("vault")*0.04 + n.tier*0.07
                + ((S.metals.gold||0) > 20 ? 0.10 : 0)
                + (n.attitude/500) + (nationSystem.disp(n).tradeBias/400)
                - Math.min(0.35, (n.tradeCount||0) * 0.03);      // 같은 상대와 반복 거래하면 값이 짜진다
    ratio = clamp(ratio, 0.55, 1.55);
    const canMetal = technologySystem.availableMetals().length > 0 && (n.stock.metal||0) > 10;
    // 금속은 덤이 아니라 교환분의 일부다. 내주는 양에 비례해서만 받을 수 있다.
    let metalAmt = canMetal ? Math.round(Math.min(giveAmt * 0.22, (1 + n.eco*0.05))) : 0;
    metalAmt = Math.max(0, Math.min(metalAmt, Math.round((n.stock.metal||0) * 0.25)));
    let getAmt = Math.max(3, Math.round(giveAmt * ratio * (metalAmt > 0 ? 0.78 : 1.0)));
    // 상대 창고에 없는 것은 받을 수 없다
    const theirStock = diplomacySystem.stockOf(n, getKey);
    getAmt = Math.min(getAmt, Math.round(theirStock * 0.3));
    if(getAmt < 3){ getAmt = Math.max(1, Math.round(theirStock * 0.3)); }
    n.offer = {turn:S.turn, giveKey, giveAmt, getKey, getAmt, metalAmt, ratio};
    return n.offer;
  },
  offerText(n){
    const o = diplomacySystem.getOffer(n), R = diplomacySystem.RES_NAME;
    return `${R[o.giveKey]} ${o.giveAmt}을(를) 내주고 ${R[o.getKey]} ${o.getAmt}${o.metalAmt ? `과 금속 ${o.metalAmt}` : ""}을(를) 받는 조건`;
  },
  trade(n){
    const o = diplomacySystem.getOffer(n);
    const R = diplomacySystem.RES_NAME;
    if(diplomacySystem.resAmount(o.giveKey) < o.giveAmt){
      return {msg:`내줄 ${R[o.giveKey]}이(가) 모자라 거래를 시작하지도 못했다.`, chance:0, res:{tier:"실패"}};
    }
    const c = probabilitySystem.calculateSuccessChance("trade", S, n);
    const res = probabilitySystem.roll(c);
    if(res.tier==="대성공" || res.tier==="성공"){
      const mul = res.tier==="대성공" ? 1.35 : 1;
      diplomacySystem.payRes(o.giveKey, o.giveAmt);
      const g1 = Math.round(o.getAmt*mul), g2 = Math.round(o.metalAmt*mul);
      // 받은 만큼 상대 창고가 준다
      if(o.getKey === "food") n.stock.wood = Math.max(0, (n.stock.wood||0) - g1*1.4);
      else n.stock[o.getKey] = Math.max(0, (n.stock[o.getKey]||0) - g1);
      if(g2 > 0) n.stock.metal = Math.max(0, (n.stock.metal||0) - g2);
      n.tradeCount = (n.tradeCount||0) + 1;
      diplomacySystem.gainRes(o.getKey, g1);
      if(g2 > 0) diplomacySystem.gainRes("metal", g2, res.tier==="대성공", n.tier);
      n.attitude = clamp(n.attitude + (res.tier==="대성공"?16:9), -100, 100);
      const intoStock = (o.giveKey === "food") ? "wood" : o.giveKey;
      n.stock[intoStock] = Math.round((n.stock[intoStock]||0) + o.giveAmt*0.6);
      S.counters.trades++;
      const gotStr = `${R[o.getKey]} ${g1}${g2 > 0 ? `과 금속 ${g2}` : ""}`;
      log(`${n.name}과 교역: ${R[o.giveKey]} -${o.giveAmt} / ${gotStr} 확보`, "good");
      return {msg:`거래 성사. ${R[o.giveKey]} ${o.giveAmt}을(를) 내주고 ${gotStr}을(를) 받았다.`, chance:c, res};
    }
    if(res.tier==="부분 성공"){
      const half = Math.round(o.giveAmt*0.5);
      diplomacySystem.payRes(o.giveKey, half);
      const g1 = Math.round(o.getAmt*0.45);
      diplomacySystem.gainRes(o.getKey, g1);
      S.counters.trades++;
      return {msg:`물량을 절반으로 줄여 겨우 맞췄다. ${R[o.giveKey]} -${half}, ${R[o.getKey]} +${g1}.`, chance:c, res};
    }
    if(res.tier==="돌발"){
      const g = Math.round(10+rnd()*15);
      diplomacySystem.gainRes("metal", g, true);
      n.attitude = clamp(n.attitude-4,-100,100);
      return {msg:`거래는 깨졌다. 다만 상대 상인이 뒷문으로 희귀 금속 ${g}을(를) 넘기고 갔다. 우리 물건은 그대로다.`, chance:c, res};
    }
    n.attitude = clamp(n.attitude-6,-100,100);
    return {msg:`조건이 맞지 않아 결렬됐다. 내주려던 ${R[o.giveKey]}은(는) 창고로 돌아왔다. 관계 -6.`, chance:c, res};
  },
  ally(n){
    const c = probabilitySystem.calculateSuccessChance("ally", S, n);
    const res = probabilitySystem.roll(c);
    if(res.tier==="대성공" || res.tier==="성공"){
      n.ally = true; n.treaty = true; n.war = false; n.attitude = clamp(n.attitude+25,-100,100);
      log(`${n.name}과 동맹을 맺었다.`, "good");
      return {msg:`${n.name}과 동맹 성립. 공동 방어와 교역 우대를 얻는다.`, chance:c, res};
    }
    if(res.tier==="부분 성공"){ n.treaty = true; n.attitude=clamp(n.attitude+8,-100,100);
      return {msg:"동맹까지는 아니지만 불가침 조약을 맺었다.", chance:c, res}; }
    if(res.tier==="돌발"){ n.attitude=clamp(n.attitude-25,-100,100);
      return {msg:`${n.name}은 동맹 제안을 약점의 신호로 읽었다. 관계 -25.`, chance:c, res}; }
    n.attitude = clamp(n.attitude-10,-100,100);
    return {msg:"동맹 제안이 거절됐다. 관계 -10.", chance:c, res};
  },
  /* 항복 요구: 전력 차가 클수록, 상대가 약해져 있을수록 잘 통한다 */
  demandSurrender(n){
    const c = probabilitySystem.calculateSuccessChance("surrender", S, n);
    const res = probabilitySystem.roll(c);
    n.demands = (n.demands || 0) + 1;
    n.lastDemand = S.turn;
    const ratio = battleSystem.playerPower() / Math.max(1, nationSystem.power(n));
    if(res.tier==="대성공" || res.tier==="성공"){
      n.conquered = true; n.war = false; n.vassal = false; S.counters.conquer++;
      const loot = {wood:Math.round(n.stock.wood*0.5), stone:Math.round(n.stock.stone*0.5), metal:Math.round(n.stock.metal*0.5)};
      S.res.wood += loot.wood; S.res.stone += loot.stone;
      const pool = technologySystem.availableMetals();
      if(pool.length) resourceSystem.gainMetal(pool[pool.length-1].id, loot.metal);
      S.morale = clamp(S.morale+12,0,100);
      log(`${n.name}이(가) 항복 문서에 서명했다. 복속.`, "good");
      return {msg:`${n.name}이(가) 항복했다. 복속과 함께 창고의 절반(목재 ${loot.wood}, 석재 ${loot.stone}, 금속 ${loot.metal})을 넘겨받았다.`, chance:c, res};
    }
    if(res.tier==="부분 성공"){
      if(n.vassal){ n.attitude = clamp(n.attitude-10,-100,100);
        return {msg:`${n.name}은(는) 완전한 항복만은 거부했다. 속국 관계는 유지된다.`, chance:c, res}; }
      if(ratio < 1.3){ n.attitude = clamp(n.attitude-12,-100,100);
        return {msg:`${n.name}의 조정이 잠시 흔들렸지만, 우리 군세가 압도적이지 않다는 결론이 났다. 무릎 꿇을 이유가 없다.`, chance:c, res}; }
      n.vassal = true; n.war = false; n.attitude = clamp(n.attitude-15,-100,100);
      log(`${n.name}이(가) 속국이 되었다.`, "good");
      return {msg:`${n.name}이(가) 무릎은 꿇었지만 왕관은 지켰다. 속국이 되어 매 턴 조공을 바친다.`, chance:c, res};
    }
    if(res.tier==="돌발"){
      n.war = true; n.attitude = -80;
      nationSystem.invasion(n);
      return {msg:`요구를 모욕으로 받아들인 ${n.name}이(가) 즉시 군을 일으켰다.`, chance:c, res};
    }
    n.attitude = clamp(n.attitude-25,-100,100);
    if(rnd() < 0.4) n.war = true;
    return {msg:`${n.name}은(는) 사절을 비웃으며 돌려보냈다. 관계 -25.`, chance:c, res};
  },
  /* 조공 요구: 복속까지는 아니어도 즉시 자원을 뜯어낸다 */
  demandTribute(n){
    const c = probabilitySystem.calculateSuccessChance("tribute", S, n);
    const res = probabilitySystem.roll(c);
    n.demands = (n.demands || 0) + 1;
    n.lastTribute = S.turn;
    if(res.tier==="대성공" || res.tier==="성공"){
      const mul = res.tier==="대성공" ? 0.45 : 0.28;
      const w = Math.round(n.stock.wood*mul), st2 = Math.round(n.stock.stone*mul), m = Math.round(n.stock.metal*mul);
      n.stock.wood -= w; n.stock.stone -= st2; n.stock.metal -= m;
      S.res.wood += w; S.res.stone += st2;
      const pool = technologySystem.availableMetals();
      if(pool.length) resourceSystem.gainMetal(pool[Math.floor(rnd()*pool.length)].id, m);
      n.attitude = clamp(n.attitude-18,-100,100);
      log(`${n.name}에게서 조공을 받아냈다.`, "good");
      return {msg:`${n.name}이(가) 목재 ${w}, 석재 ${st2}, 금속 ${m}을(를) 바쳤다. 관계 -18.`, chance:c, res};
    }
    if(res.tier==="부분 성공"){
      const w = Math.round(n.stock.wood*0.1); n.stock.wood -= w; S.res.wood += w;
      n.attitude = clamp(n.attitude-10,-100,100);
      return {msg:`체면치레 수준의 예물만 왔다. 목재 +${w}.`, chance:c, res};
    }
    if(res.tier==="돌발"){
      n.attitude = clamp(n.attitude+20,-100,100);
      return {msg:`${n.name}의 재상이 요구를 기회로 보고 뒷거래를 제안해 왔다. 관계 +20.`, chance:c, res};
    }
    n.attitude = clamp(n.attitude-20,-100,100);
    if(rnd() < 0.3) n.war = true;
    return {msg:"요구는 거절당했고 국경의 공기만 험해졌다.", chance:c, res};
  },
  truce(n){
    const c = probabilitySystem.calculateSuccessChance("truce", S, n);
    const res = probabilitySystem.roll(c);
    if(res.tier==="대성공" || res.tier==="성공"){
      n.war = false; n.attitude = clamp(n.attitude+15,-100,100);
      log(`${n.name}과(와) 휴전했다.`, "good");
      return {msg:`${n.name}이(가) 칼을 거뒀다. 전쟁이 끝났다.`, chance:c, res};
    }
    if(res.tier==="부분 성공"){ n.attitude = clamp(n.attitude+6,-100,100);
      return {msg:"사절은 문전에서 돌아왔지만 적의는 조금 누그러졌다.", chance:c, res}; }
    if(res.tier==="돌발"){ n.war = false; n.ally = false; n.attitude = clamp(n.attitude+35,-100,100);
      return {msg:`${n.name}의 왕이 갑자기 태도를 바꿔 화친을 청했다. 전쟁이 끝났다.`, chance:c, res}; }
    n.attitude = clamp(n.attitude-5,-100,100);
    return {msg:"휴전 제안은 약함의 증거로 읽혔다.", chance:c, res};
  },
  betray(n){
    const c = probabilitySystem.calculateSuccessChance("betray", S, n);
    const res = probabilitySystem.roll(c);
    const wasAlly = n.ally;
    n.ally = false; n.treaty = false;
    if(res.tier==="대성공" || res.tier==="성공"){
      const mul = res.tier==="대성공" ? 1.7 : 1;
      const gw = Math.round(n.stock.wood*0.35*mul), gs = Math.round(n.stock.stone*0.3*mul), gm = Math.round(n.stock.metal*0.3*mul);
      S.res.wood += gw; S.res.stone += gs;
      const pool = technologySystem.availableMetals();
      if(pool.length) resourceSystem.gainMetal(pool[pool.length-1].id, gm);
      n.stock.wood -= gw; n.stock.stone -= gs; n.stock.metal -= gm;
      n.attitude = -90; n.war = rnd() < 0.5;
      S.counters.betrays++;
      // 신뢰 붕괴는 세계 전체에 퍼진다
      for(const o of S.nations) if(o !== n && o.discovered) o.attitude = clamp(o.attitude - (wasAlly?14:8), -100, 100);
      technologySystem.refreshVisible();
      log(`${n.name}을(를) 배신했다. 소문은 국경을 넘어 퍼진다.`, "bad");
      return {msg:`배신 성공. 목재 +${gw}, 석재 +${gs}, 금속 +${gm}. 그러나 모든 국가가 당신을 다시 본다.`, chance:c, res};
    }
    if(res.tier==="부분 성공"){
      n.attitude = -60; S.counters.betrays++;
      for(const o of S.nations) if(o !== n && o.discovered) o.attitude = clamp(o.attitude-5,-100,100);
      return {msg:"약탈은 절반만 성공했고 정체는 들통났다.", chance:c, res};
    }
    if(res.tier==="돌발"){
      n.attitude = -100; n.war = true;
      for(const o of S.nations) if(o !== n && o.discovered) o.attitude = clamp(o.attitude-18,-100,100);
      return {msg:`배신이 실패했을 뿐 아니라, ${n.name}이(가) 주변국에 증거를 돌렸다. 모두가 등을 돌린다.`, chance:c, res};
    }
    n.attitude = -80; n.war = rnd()<0.6;
    for(const o of S.nations) if(o !== n && o.discovered) o.attitude = clamp(o.attitude-10,-100,100);
    return {msg:"매복이 발각됐다. 얻은 것 없이 적만 늘었다.", chance:c, res};
  }
};
