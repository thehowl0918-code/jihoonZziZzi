<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문명의 서 — 종족 연대기</title>
<style>
:root{
  --bg:#e9e6ef; --panel:#fbfaff; --panel2:#f2eff7; --ink:#1d1a26; --muted:#645c74;
  --line:#d3cde0; --accent:#a8642a; --accent-soft:#f0dcc6; --arcane:#6b52b8; --jade:#2f7f66;
  --danger:#b03a2e; --good:#3f7f3a; --gold:#a07a1c; --shadow:rgba(30,24,50,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111b; --panel:#1b1926; --panel2:#221f2e; --ink:#ece5d9; --muted:#9b93a8;
    --line:#312c42; --accent:#d29155; --accent-soft:#3a2a1d; --arcane:#9d86e8; --jade:#5db698;
    --danger:#d9705f; --good:#8cc47a; --gold:#d8ae4c; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#13111b; --panel:#1b1926; --panel2:#221f2e; --ink:#ece5d9; --muted:#9b93a8;
  --line:#312c42; --accent:#d29155; --accent-soft:#3a2a1d; --arcane:#9d86e8; --jade:#5db698;
  --danger:#d9705f; --good:#8cc47a; --gold:#d8ae4c; --shadow:rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
h1,h2,h3,.serif{font-family:"Iropke Batang","Noto Serif KR","Nanum Myeongjo",Georgia,serif;}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 .4rem}
h3{font-size:.95rem;margin:0 0 .3rem}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 1px 3px var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* ---------- setup ---------- */
#setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.setup-inner{max-width:980px;width:100%}
.title-block{border-left:3px solid var(--accent);padding-left:14px;margin-bottom:18px}
.title-block h1{font-size:2rem}
.species-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0}
.species{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;text-align:left;transition:border-color .12s}
.species:hover{border-color:var(--accent)}
.species[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.species.locked{opacity:.55;cursor:not-allowed}
.species .nm{font-weight:700;display:flex;gap:6px;align-items:center}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;border:1px solid var(--line);font-size:.72rem;background:var(--panel)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- game layout ---------- */
#game{display:none}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.tierchip{padding:2px 10px;border-radius:99px;font-weight:700;font-size:.8rem;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 275px;gap:10px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px}
.stat{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:.85rem;border-bottom:1px dotted var(--line)}
.stat:last-child{border-bottom:0}
.stat b{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--accent)}
.bar.good > i{background:var(--good)} .bar.bad > i{background:var(--danger)}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:9px 11px;margin-bottom:7px}
.choice:hover:not(:disabled){background:var(--accent-soft)}
.choice .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.choice .nm{font-weight:650}
.pc{font-variant-numeric:tabular-nums;font-weight:700;font-size:.82rem}
.pc.hi{color:var(--good)} .pc.mid{color:var(--gold)} .pc.lo{color:var(--danger)}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tab{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.85rem}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.narr{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:10px}
.narr .ev{color:var(--arcane);font-weight:700}
.story{font-family:"Iropke Batang","Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-size:1.02rem;line-height:1.75;margin:.35rem 0 .1rem}
.choice.rolling{border-left-color:var(--arcane);background:var(--accent-soft)}
.choice:disabled{opacity:.5}
.rollbar{height:4px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.rollbar > i{display:block;height:100%;width:0;background:var(--arcane);animation:rollfill 1s linear forwards}
@keyframes rollfill{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){.rollbar > i{width:100%;animation:none}}
.rolling-text{color:var(--arcane)}
.costline{font-size:.78rem;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.costline b{font-variant-numeric:tabular-nums}
.cost-ok{color:var(--muted)} .cost-no{color:var(--danger);font-weight:600}
.trait{font-size:.74rem;color:var(--jade);margin-top:4px}
.mech{font-size:.82rem;color:var(--muted);border-top:1px dotted var(--line);margin-top:8px;padding-top:6px}
.log-line .detail{color:var(--muted);font-size:.78rem;display:block;margin-left:2px}
.log-line .when{color:var(--muted);font-size:.72rem}
.res{display:flex;justify-content:space-between;font-size:.85rem;padding:1px 0}
.log-line{padding:4px 0;border-bottom:1px dotted var(--line);font-size:.83rem}
.log-line:last-child{border-bottom:0}
.k-good{color:var(--good)} .k-bad{color:var(--danger)} .k-mag{color:var(--arcane)} .k-warn{color:var(--gold)}
.nation{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:7px;background:var(--panel2);font-size:.83rem}
.nation .hd{display:flex;justify-content:space-between;gap:6px;align-items:center}
.rel{font-size:.72rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line)}
.scroller{max-height:340px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mobile-tabs{display:none}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:16px;max-width:560px;width:92%;box-shadow:0 12px 40px var(--shadow)}
dialog::backdrop{background:rgba(10,8,18,.6)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.85rem}
.techrow{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;background:var(--panel2);font-size:.83rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:920px){
  .grid{grid-template-columns:1fr}
  .mobile-tabs{display:flex}
  .col.hide-m{display:none}
  .scroller{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ================= 시작 화면 ================= -->
<div id="setup"><div class="setup-inner">
  <div class="title-block">
    <h1>문명의 서 — 종족 연대기</h1>
    <p class="muted" style="margin:.35rem 0 0">
      한 종족의 첫 불씨에서 시작해 자원을 캐고, 미지의 땅을 정찰하고, 낯선 국가와 거래하거나 전쟁한다.
      모든 행동은 주사위가 결정한다. 확률은 선택 전에 전부 공개된다.
    </p>
  </div>

  <div class="card" style="margin-bottom:10px">
    <div class="row">
      <b class="small">계정</b>
      <span id="profNow" class="badge"></span>
      <button class="btn small" id="profSwitch">전환</button>
      <button class="btn small" id="profNew">새 계정</button>
      <span class="sp"></span>
      <span class="tiny muted" id="profInfo"></span>
    </div>
    <p class="tiny muted" style="margin:.5rem 0 0">
      한 기기에서 여러 사람이 각자 기록과 히든 해금을 따로 가질 수 있다. 저장 기록도 계정별로 쌓인다.
    </p>
  </div>

  <div class="card">
    <h2>종족을 고른다</h2>
    <div class="species-grid" id="speciesGrid"></div>
    <div id="speciesDetail" class="card" style="background:var(--panel2)"></div>

    <h3 style="margin-top:14px">난이도</h3>
    <div class="species-grid" id="diffGrid" style="margin:8px 0"></div>

    <div class="row" style="margin-top:12px">
      <label class="small muted" for="nameInput">국가명</label>
      <input type="text" id="nameInput" size="16" maxlength="14" placeholder="예: 서리늪 연맹">
      <button class="btn small" id="renameBtn">이름 추천</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="small muted" for="seedInput">세계 시드</label>
      <input type="text" id="seedInput" size="12" maxlength="12">
      <button class="btn small" id="reseedBtn">새로 뽑기</button>
      <span class="sp"></span>
      <button class="btn small" id="themeBtn2">화면 전환</button>
      <button class="btn" id="loadBtn">기록에서 이어하기</button>
      <button class="btn primary" id="startBtn" disabled>문명 시작</button>
    </div>
    <p class="tiny muted" style="margin:.6rem 0 0">
      같은 시드는 같은 세계(국가 구성·초기 지형)를 만든다. 단, 행동 판정은 매번 새로 굴린다.
    </p>
  </div>
</div></div>

<!-- ================= 게임 화면 ================= -->
<div id="game"><div class="wrap">
  <div class="topbar">
    <h1 id="hTitle" class="serif">문명의 서</h1>
    <span class="tierchip" id="hTier">우드</span>
    <span class="small" id="hPop"></span>
    <span class="small muted" id="hDate"></span>
    <span class="sp"></span>
    <button class="btn small" id="saveBtn">저장</button>
    <button class="btn small" id="loadBtn2">기록</button>
    <button class="btn small" id="restartBtn">새 게임</button>
    <button class="btn small" id="themeBtn">화면</button>
  </div>

  <div class="mobile-tabs tabs" role="tablist">
    <button class="tab" data-m="left" role="tab">문명</button>
    <button class="tab" data-m="center" role="tab" aria-selected="true">행동</button>
    <button class="tab" data-m="right" role="tab">세계</button>
    <button class="tab" data-m="log" role="tab">기록</button>
  </div>

  <div class="grid">
    <!-- 좌 -->
    <div class="col" id="colLeft">
      <div class="card">
        <h2 id="lSpecies"></h2>
        <div id="lVital"></div>
      </div>
      <div class="card">
        <h3>능력치</h3>
        <div id="lStats"></div>
      </div>
      <div class="card">
        <h3>문명 등급</h3>
        <div id="lTier"></div>
      </div>
    </div>

    <!-- 중앙 -->
    <div class="col" id="colCenter">
      <div class="card">
        <div class="narr" id="cNarr"></div>
        <div class="tabs" id="cTabs"></div>
        <div id="cChoices"></div>
      </div>
      <div class="card" id="logCard">
        <h3>연대기</h3>
        <div class="scroller" id="cLog"></div>
      </div>
    </div>

    <!-- 우 -->
    <div class="col" id="colRight">
      <div class="card">
        <h3>자원</h3>
        <div id="rRes"></div>
      </div>
      <div class="card">
        <h3>금속고</h3>
        <div id="rMetal"></div>
      </div>
      <div class="card">
        <h3>알려진 국가 <span id="rNatCount" class="tiny muted"></span></h3>
        <div id="rNations"></div>
      </div>
      <div class="card">
        <h3>연구와 건물</h3>
        <div id="rTech"></div>
      </div>
    </div>
  </div>
</div></div>

<dialog id="modal"><div id="modalBody"></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="modalClose">닫기</button></div></dialog>

<script>
"use strict";
/* =========================================================================
   문명의 서 — 종족 연대기
   시스템 분리: gameState / speciesSystem / resourceSystem / technologySystem
                nationSystem / diplomacySystem / explorationSystem / eventSystem
                probabilitySystem / battleSystem / turnSystem / saveSystem / uiSystem
   ========================================================================= */

/* ---------------------- 상수 데이터 ---------------------- */
const TIERS = ["우드","아이언","브론즈","실버","골드","플레티넘","옵시디언","다이아몬드","티타늄","아다만티움"];
const TIER_COLOR = ["#8a6b4a","#8d8d96","#b07a45","#9aa3ae","#c8a232","#9fb7c9","#7a6a96","#6fb5c8","#6f8f9f","#b46ad0"];
const TIER_REQ  = [0, 60, 155, 320, 560, 900, 1350, 2000, 2900, 3600]; // 문명 점수 임계값

const METALS = [
  {id:"copper",   name:"구리",       rare:1,  tier:0, atk:2,  def:2,  cost:1.0, note:"무르지만 다루기 쉽다. 초기 도구의 뼈대."},
  {id:"tin",      name:"주석",       rare:2,  tier:0, atk:1,  def:1,  cost:1.0, note:"단독으로는 약하다. 구리와 섞어야 값을 한다."},
  {id:"iron",     name:"철",         rare:2,  tier:1, atk:5,  def:5,  cost:1.1, note:"흔하고 단단하다. 모든 군대의 기준."},
  {id:"bronze",   name:"청동",       rare:3,  tier:2, atk:4,  def:7,  cost:1.2, note:"녹슬지 않아 방어구와 건축 금속으로 쓴다."},
  {id:"silver",   name:"은",         rare:4,  tier:3, atk:6,  def:4,  cost:1.4, note:"마력 전도율이 높다. 마법력 보정."},
  {id:"gold",     name:"금",         rare:5,  tier:4, atk:3,  def:3,  cost:1.6, note:"무기로는 쓸모없지만 외교와 교역에서 값이 두 배."},
  {id:"platinum", name:"백금",       rare:6,  tier:5, atk:8,  def:8,  cost:1.9, note:"정밀 기계 부품. 생산 시설 효율을 올린다."},
  {id:"obsidian", name:"흑요석강",   rare:7,  tier:6, atk:12, def:6,  cost:2.2, note:"베는 힘은 최상. 다만 잘 깨진다."},
  {id:"mithril",  name:"미스릴",     rare:8,  tier:7, atk:11, def:12, cost:2.6, note:"깃털처럼 가볍고 마력을 머금는다."},
  {id:"titanium", name:"티타늄",     rare:9,  tier:8, atk:14, def:15, cost:3.0, note:"무겁지 않으면서 부러지지 않는다."},
  {id:"adamant",  name:"아다만티움", rare:10, tier:9, atk:20, def:22, cost:4.0, note:"세계의 뼈. 부수는 방법이 알려지지 않았다."}
];
const METAL_BY_ID = Object.fromEntries(METALS.map(m=>[m.id,m]));

/* 보유량이 기준을 넘긴 금속은 문명 전체에 고유한 보정을 준다 */
const METAL_TRAITS = [
  {id:"copper",  need:15, t:"건설 판정 +5%p",                 build:0.05},
  {id:"tin",     need:15, t:"연구 판정 +3%p",                 research:0.03},
  {id:"iron",    need:20, t:"군사 훈련 판정 +5%p",            train:0.05},
  {id:"bronze",  need:15, t:"방어 판정 +5%p",                 defend:0.05},
  {id:"silver",  need:15, t:"마법 판정 +5%p · 마력 전력 +12%", magic:0.05},
  {id:"gold",    need:20, t:"외교·교역 판정 +5%p · 교환비 +0.15", dip:0.05},
  {id:"platinum",need:15, t:"자원 생산 +8%",                  prod:0.08},
  {id:"obsidian",need:15, t:"공격 +8%p · 방어 -4%p",          war:0.08, defend:-0.04},
  {id:"mithril", need:15, t:"활동 효율 +3% · 마력 전력 +18%",  activity:0.03},
  {id:"titanium",need:15, t:"공격·방어 +6%p",                 war:0.06, defend:0.06},
  {id:"adamant", need:10, t:"공격·방어 +15%p · 붕괴·지진 피해 절반", war:0.15, defend:0.15, disaster:-0.5}
];
function mt(key){
  let v = 0;
  for(const t of METAL_TRAITS) if(t[key] && (S.metals[t.id]||0) >= t.need) v += t[key];
  return v;
}
function activeTraits(){ return METAL_TRAITS.filter(t => (S.metals[t.id]||0) >= t.need); }

/* 난이도: 자원 수급, 연구 확률, 세계의 적대성, 생존 소모를 한꺼번에 조절한다 */
const DIFFS = [
  {id:"normal", n:"표준",      d:"자원은 빠듯하고 이웃은 기회를 노린다. 기본 난이도.",           res:1.00, research:1.00, hostility:1.00, upkeep:1.00},
  {id:"hard",   n:"가혹",      d:"수확은 줄고 연구는 막히며 국경이 조용할 날이 없다.",           res:0.82, research:0.80, hostility:1.45, upkeep:1.18},
  {id:"brutal", n:"멸망 직전", d:"모든 것이 부족하다. 한 번의 판단 착오가 문명을 끝낸다.",       res:0.70, research:0.70, hostility:1.85, upkeep:1.35}
];
function DF(){ return DIFFS.find(d => d.id === (S && S.diff)) || DIFFS[0]; }

const VITALS = {
  food:  {name:"식량",   unit:"단위", desc:"굶주리면 인구가 줄고 사기가 무너진다."},
  sun:   {name:"일광",   unit:"%",    desc:"엘프는 매일 광합성을 해야 한다. 밤에는 채울 수 없다."},
  liquor:{name:"술",     unit:"통",   desc:"드워프의 사기는 술통 바닥과 함께 마른다."},
  blood: {name:"피",     unit:"단위", desc:"굶은 뱀파이어는 전투력부터 잃는다."},

/* ---------------------- 난수 ---------------------- */
function hashSeed(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* 행동 판정용: 상태에 저장되는 스트림 */
function rnd(){
  let a = (S.rngState = (S.rngState + 0x6D2B79F5) >>> 0);
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v*10)/10;

/* ---------------------- speciesSystem ---------------------- */
const speciesSystem = {
  /* 활동 효율: 시간대 + 종족 + 생존자원 */
  activity(){
    let a = 1.0;
    const s = sp();
    if(S.phase === "밤"){
      a += s.night;                       // 뱀파이어/리치는 밤에 상승
      if(S.species === "elf") a -= 0.05;
    }else{
      if(S.species === "vampire" || S.species === "lich"){
        const pen = 0.42 * Math.max(0, 1 + S.mods.dayPen);   // dayPen: -1이면 0
        a -= pen;
      }
    }
    if(S.species === "elf"){
      const need = Math.max(0, 1 + S.mods.sunNeed);
      if(need > 0){
        const sun = S.res.sun;
        if(sun < 30) a -= 0.30 * need;
        else if(sun < 60) a -= 0.12 * need;
      }
    }
    a *= speciesSystem.vitalFactor();
    a *= 0.72 + (S.morale/100) * 0.42;     // 사기 0 → 0.72, 100 → 1.14
    a *= 1 + mt("activity");
    return clamp(a, 0.25, 1.6);
  },
  vitalFactor(){
    const s = sp();
    if(s.vital === "sun") return 1;
    const v = S.res[s.vital] || 0;
    const need = speciesSystem.vitalNeed();
    if(need <= 0) return 1;
    if(v <= 0) return 0.75;
    if(v < need * 3) return 0.9;
    return 1;
  },
  vitalNeed(){
    const s = sp();
    if(s.vital === "sun") return 0;
    return S.pop * s.vitalPer * Math.max(0.4, 1 + S.mods.upkeep) * DF().upkeep;
  },
  foodNeed(){
    const s = sp();
    return S.pop * 0.043 * s.food * Math.max(0.4, 1 + S.mods.upkeep) * DF().upkeep;
  }
};
